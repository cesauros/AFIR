<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1 { color: #38d9a9; }

.estado {
  margin: 15px;
  color: #b8c5d6;
  font-size: 14px;
}

#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

#portada, #tablero {
  max-width: 600px;
  margin: auto;
}

#imagenPremio {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  margin: 20px auto;
  border-radius: 12px;
}

#selectorRifa {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 20px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
  background: #263449;
  color: white;
}

#participar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 17px 35px;
  border-radius: 9px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  margin: 20px;
}

#volver {
  background: #263449;
  color: white;
  border: 1px solid #526078;
  padding: 12px 22px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  margin: 12px;
}

.oculto { display: none !important; }

/* OCULTAR EL TABLERO DURANTE LA CARGA */

.grid.cargando {
  visibility: hidden;
}

input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
}

#reservar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #38d9a9;
  font-size: 15px;
  margin: 12px;
}

@media(max-width:450px) {
  body { padding: 12px; }
}

.galeria-rifas {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 5px 25px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.tarjeta-rifa {
  flex: 0 0 82%;
  max-width: 340px;
  background: #192638;
  border: 1px solid #39485b;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  scroll-snap-align: center;
}

.tarjeta-rifa img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #263449;
}

.tarjeta-rifa .info-rifa {
  padding: 14px;
}

.tarjeta-rifa h3 {
  color: #38d9a9;
  margin: 5px 0 10px;
}

.tarjeta-rifa p {
  color: #b8c5d6;
  margin: 6px 0;
}

.tarjeta-rifa button {
  background: #25d366;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 7px;
  font-weight: bold;
  width: 100%;
}

.tarjeta-rifa .abrir-rifa {
  display: block;
  background: #25d366;
  color: white;
  text-align: center;
  padding: 12px;
  border-radius: 7px;
  font-weight: bold;
}

.tarjeta-rifa:hover {
  border-color: #38d9a9;
}

/* =====================================
   AFIR - TABLERO CASINO ESPECTACULAR
===================================== */

.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  margin: 30px auto;
  padding: 6px;
  overflow: hidden;
  isolation: isolate;
  border: 2px solid #00eaff;
  border-radius: 12px;
  background: #071322;
  box-shadow:
    0 0 12px #00eaff,
    0 0 30px rgba(0,234,255,.35),
    inset 0 0 25px rgba(0,234,255,.15);
}

/* IMAGEN DEL PREMIO */

.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(5px) brightness(.5);
  transform: scale(1.05);
  z-index: -2;
}

/* ILUMINACIÓN MÓVIL INTENSA */

.grid::after {
  content: "";
  position: absolute;
  inset: -100%;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(
    110deg,
    transparent 35%,
    rgba(0,234,255,.12) 42%,
    rgba(0,234,255,.45) 47%,
    rgba(255,215,0,.38) 50%,
    rgba(0,234,255,.45) 53%,
    transparent 62%
  );
  animation: luzAfirm 4s ease-in-out infinite alternate;
}

@keyframes luzAfirm {
  from { transform: translateX(-35%); }
  to { transform: translateX(35%); }
}

/* PULSO LUMINOSO DEL TABLERO */

.grid {
  animation: pulsoTablero 3s ease-in-out infinite alternate;
}

@keyframes pulsoTablero {
  from {
    box-shadow: 0 0 12px #00eaff,
                0 0 25px rgba(0,234,255,.3);
  }
  to {
    box-shadow: 0 0 20px #00eaff,
                0 0 45px rgba(0,234,255,.65),
                0 0 65px rgba(255,215,0,.18);
  }
}

/* BRILLO EN LAS TECLAS */

button.numero:not(:disabled) {
  animation: brilloTecla 2.5s ease-in-out infinite alternate;
}

@keyframes brilloTecla {
  from {
    filter: brightness(.9);
  }
  to {
    filter: brightness(1.3);
  }
}

button.numero.seleccionado {
  animation: ninguna;
  filter: brightness(1.4);
}

/* IMAGEN COMPLETAMENTE DESCUBIERTA */

.grid.completado::before {
  filter: none;
}

/* TECLAS 3D */

button.numero {
  position: relative;
  z-index: 1;
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 1px solid rgba(0,234,255,.4);
  border-radius: 6px;
  background: linear-gradient(
    145deg,
    #173550,
    #091727
  );
  color: white;
  font-size: clamp(10px, 3.2vw, 17px);
  font-weight: bold;
  cursor: pointer;
  box-shadow:
    0 3px 0 #03101c,
    0 5px 8px rgba(0,0,0,.5),
    inset 0 1px 2px rgba(255,255,255,.2);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease;
}

/* EFECTO AL TOCAR */

button.numero:active {
  transform: translateY(2px) scale(.96);
}

/* SELECCIONADO */

button.numero.seleccionado {
  transform: translateY(-3px);
  background: linear-gradient(
    145deg,
    #00ffd0,
    #00a88c
  );
  color: #031c20;
  border: 1px solid #aafff0;
  box-shadow:
    0 0 8px #00ffd0,
    0 0 20px rgba(0,255,208,.8),
    0 4px 0 #006b60;
}

/* RESERVADO */

button.numero.reservado {
  background: linear-gradient(
    145deg,
    #ff6868,
    #a51e35
  );
  color: white;
  border-color: #ff9999;
  box-shadow:
    0 0 10px rgba(255,50,70,.6),
    0 3px 0 #641321;
  cursor: not-allowed;
}

/* VENDIDO */

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  box-shadow: none;
  cursor: default;
}

/* ESTADOS DESHABILITADOS */

button.numero:disabled {
  opacity: 1;
}

/* MOVIMIENTO SUTIL */

@media (hover: hover) {
  button.numero:not(:disabled):hover {
    transform: translateY(-2px);
    border-color: #00ffff;
    box-shadow:
      0 0 12px rgba(0,234,255,.7),
      0 4px 0 #03101c;
  }
}

/* REDUCIR MOVIMIENTO SI EL USUARIO LO PREFIERE */

@media (prefers-reduced-motion: reduce) {
  .grid::after {
    animation: none;
  }

  button.numero {
    transition: none;
  }
}
  
</style>
</head>

<body>

<!-- PORTADA -->

<section id="portada">

  <div id="galeriaRifas" class="galeria-rifas">
    <p>Cargando rifas...</p>
  </div>

</section>

<!-- TABLERO -->

<section id="tablero" class="oculto">

  <button id="volver">
    ← Volver a la portada
  </button>

  <h2>adivina la imagen</h2>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <p>Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">
    confirmar reserva
  </button>

  <p id="mensaje"></p>

</section>

<script>

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

/* IDENTIFICADOR PARA EVITAR CARGAS ANTIGUAS */

let cargaNumerosId = 0;
let enlaceNotificacion = null;
let reservaCreada = false;
let telefonoPendiente = "";
let comprobandoReserva = false;

async function comprobarReservaPendiente() {
  const telefono = document.getElementById("telefono").value.trim();

  if (!telefono || !raffleId || comprobandoReserva) return;

  comprobandoReserva = true;

  try {
    const respuesta = await fetch(
      API + "/api/reservations/status?raffle_id=" +
      raffleId + "&phone=" + encodeURIComponent(telefono)
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) return;

    reservar.hidden = resultado.pending;
    mensaje.textContent = resultado.pending
      ? "Ya tienes una reserva pendiente de pago. Completa el pago para poder reservar nuevamente."
      : "";

  } catch(error) {
    console.error(error);
  } finally {
    comprobandoReserva = false;
  }
}

const grid = document.getElementById("grid");
const mensaje = document.getElementById("mensaje");
const reservar = document.getElementById("reservar");

const portada = document.getElementById("portada");
const tablero = document.getElementById("tablero");

// NORMALIZAR IMÁGENES

function normalizarImagen(valor) {
  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}

// CARGAR TODAS LAS RIFAS ACTIVAS

async function cargarRifas() {
  try {
    const respuesta = await fetch(API + "/api/raffles", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las rifas.");
    }

    const rifas = await respuesta.json();
    const galeria = document.getElementById("galeriaRifas");

    galeria.replaceChildren();

    if (!rifas.length) {
      galeria.textContent = "No hay rifas activas.";
      return;
    }

    rifas.forEach(rifa => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta-rifa";

      const img = document.createElement("img");
      img.src = normalizarImagen(rifa.prize_image);
      img.alt = "Premio de " + rifa.name;

      const info = document.createElement("div");
      info.className = "info-rifa";

      const nombre = document.createElement("h3");
      nombre.textContent = rifa.name;

      info.appendChild(nombre);

      if (rifa.ticket_price != null) {
        const precio = document.createElement("p");
        precio.textContent =
          "Precio por número: " + rifa.ticket_price;
        info.appendChild(precio);
      }

      if (rifa.draw_date) {
        const fecha = document.createElement("p");
        fecha.textContent = "Sorteo: " + rifa.draw_date;
        info.appendChild(fecha);
      }

      tarjeta.appendChild(img);
      tarjeta.appendChild(info);
      tarjeta.onclick = () => abrirRifa(rifa.id);
      galeria.appendChild(tarjeta);
    });

  } catch(error) {
    console.error(error);
    document.getElementById("galeriaRifas").textContent =
      error.message;
  }
}

async function abrirRifa(id) {
  const nuevoId = Number(id);

  if (!Number.isSafeInteger(nuevoId) || nuevoId < 1) return;

  raffleId = nuevoId;

  cargaNumerosId++;
  seleccionados = [];
  numeros = [];

  mensaje.textContent = "";

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  portada.classList.add("oculto");
  tablero.classList.remove("oculto");

  window.scrollTo(0, 0);

  try {
    await cargarRifa();
    await cargarNumeros();

  } catch(error) {
    console.error(error);

    tablero.classList.add("oculto");
    portada.classList.remove("oculto");
  }
}
  
// CARGAR UNA RIFA ESPECÍFICA

async function cargarRifa() {

  if (!raffleId) return;

  const respuesta = await fetch(
    API + "/api/raffle?raffle_id=" + raffleId,
    { cache: "no-store" }
  );

  if (!respuesta.ok) {
    throw new Error("No se pudo cargar la rifa.");
  }

  const rifa = await respuesta.json();

  imagenPuzzle = normalizarImagen(rifa.puzzle_image);
}

document.getElementById("volver").onclick = () => {

  tablero.classList.add("oculto");
  portada.classList.remove("oculto");

  window.scrollTo(0, 0);
};

// CARGAR NÚMEROS DE LA RIFA SELECCIONADA

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    /* OCULTAR EL TABLERO ANTES DE CARGAR */

    grid.classList.add("cargando");
    grid.style.backgroundImage = "none";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    /* IGNORAR RESPUESTAS DE OTRAS CARGAS O RIFAS */

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    /* MOSTRAR SOLO DESPUÉS DE DIBUJAR LOS 100 NÚMEROS */

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    grid.style.backgroundImage = "none";
    
    grid.classList.add("cargando");
    
    mensaje.textContent = "No se pudo cargar el tablero. Intenta nuevamente.";
    
    console.error(error);
  }
}

// DIBUJAR TABLERO

function dibujarTablero() {

  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      dibujarTablero();
    };

    grid.appendChild(b);
  }

  /* APLICAR EL PUZZLE SOLO DESPUÉS DE CREAR LOS 100 BOTONES */

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle ? 'url("' + imagenPuzzle + '")' : "none"
  );
  
  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;
  
  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}

// RESERVAR NÚMEROS

reservar.onclick = async () => {

  // SEGUNDO CLIC: ABRIR WHATSAPP
  if (enlaceNotificacion) {
    window.open(enlaceNotificacion, "_blank");
    enlaceNotificacion = null;
    reservar.textContent = "Confirmar reserva";
    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const contactType = /[a-zA-Z@_]/.test(telefono)
    ? "username"
    : "phone";

  mensaje.textContent = "";

  if (!raffleId) {
    mensaje.textContent = "Selecciona una rifa.";
    return;
  }

  if (!seleccionados.length) {
    mensaje.textContent = "Selecciona al menos un número.";
    return;
  }

  if (!nombre || !telefono) {
    mensaje.textContent = "Completa tu nombre y WhatsApp.";
    return;
  }

  reservar.disabled = true;
  reservar.textContent = "Procesando reserva...";

  try {

    const respuesta = await fetch(
      API + "/api/reservations",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          raffle_id: raffleId,
          name: nombre,
          phone: telefono,
          contactType: contactType,
          numbers: seleccionados
        })
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.error || "No se pudo completar la reserva"
      );
    }

    mensaje.replaceChildren();

    const confirmacion = document.createElement("p");

    confirmacion.textContent =
      "¡Reserva creada! Código: " +
      resultado.reservation.reservation_code +
      ". Tienes 72 horas para realizar el pago.";

    mensaje.appendChild(confirmacion);

    enlaceNotificacion = resultado.admin_whatsapp_url;

    seleccionados = [];

    await cargarNumeros();

    if (enlaceNotificacion) {
      reservar.textContent = "Notificar por WhatsApp";
      reservar.disabled = false;
    } else {
      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;
      mensaje.appendChild(
        document.createTextNode(
          " No se pudo generar el enlace de WhatsApp."
        )
      );
    }

  } catch(error) {

    mensaje.textContent = error.message;
    reservar.textContent = "Confirmar reserva";
    reservar.disabled = false;

    await cargarNumeros();
  }
};

document.getElementById("telefono").addEventListener(
  "change",
  comprobarReservaPendiente
);

setInterval(comprobarReservaPendiente, 10000);

// INICIO

cargarRifas();

setInterval(() => {

  if (!tablero.classList.contains("oculto") && raffleId) {
    cargarNumeros();
  }

}, 20000);

</script>

</body>
</html>
