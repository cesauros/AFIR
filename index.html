<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1 { color: #38d9a9; }

.estado {
  margin: 15px;
  color: #b8c5d6;
  font-size: 14px;
}

#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

#portada, #tablero {
  max-width: 600px;
  margin: auto;
}

#imagenPremio {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  margin: 20px auto;
  border-radius: 12px;
}

#selectorRifa {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 20px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
  background: #263449;
  color: white;
}

#participar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 17px 35px;
  border-radius: 9px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  margin: 20px;
}

#volver {
  background: #263449;
  color: white;
  border: 1px solid #526078;
  padding: 12px 22px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  margin: 12px;
}

.oculto { display: none !important; }

.grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 0.5px;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  margin: 25px auto;
  background-color: #263449;
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  border: 1px solid #526078;
}

/* OCULTAR EL TABLERO DURANTE LA CARGA */

.grid.cargando {
  visibility: hidden;
}

button.numero {
  position: relative;
  z-index: 2;
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 8px;
  background: #263449;
  color: white;
  font-size: clamp(10px, 3.2vw, 17px);
  cursor: pointer;
}

button.numero.seleccionado {
  background: #38d9a9;
  color: #101827;
}

button.numero.reservado {
  background: #e05252;
  color: white;
  cursor: not-allowed;
}

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  cursor: default;
}

button.numero:disabled {
  opacity: 1;
}

input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
}

#reservar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #38d9a9;
  font-size: 15px;
  margin: 12px;
}

@media(max-width:450px) {
  body { padding: 12px; }
}
  .grid {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background-image: none !important;
}

.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(5px) brightness(0.5);
  transform: scale(1.05);
  z-index: -1;
}

.grid.completado::before {
  filter: none;
}

.galeria-rifas {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 5px 25px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.tarjeta-rifa {
  flex: 0 0 82%;
  max-width: 340px;
  background: #192638;
  border: 1px solid #39485b;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  scroll-snap-align: center;
}

.tarjeta-rifa img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #263449;
}

.tarjeta-rifa .info-rifa {
  padding: 14px;
}

.tarjeta-rifa h3 {
  color: #38d9a9;
  margin: 5px 0 10px;
}

.tarjeta-rifa p {
  color: #b8c5d6;
  margin: 6px 0;
}

.tarjeta-rifa button {
  background: #25d366;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 7px;
  font-weight: bold;
  width: 100%;
}

.tarjeta-rifa .abrir-rifa {
  display: block;
  background: #25d366;
  color: white;
  text-align: center;
  padding: 12px;
  border-radius: 7px;
  font-weight: bold;
}

.tarjeta-rifa:hover {
  border-color: #38d9a9;
}

/* RIPPLE LUMINOSO */

.grid {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.ripple-wave {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    transparent 42%,
    rgba(56,217,169,.5) 47%,
    white 50%,
    rgba(56,217,169,.7) 53%,
    transparent 62%
  );
  transform: translate(-50%, -50%) scale(0);
  animation: rippleExpand 1.35s ease-out forwards;
}

@keyframes rippleExpand {
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
  }
}

.grid {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

/* Fondo */
.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(1px) brightness(1);
  transform: scale(1.05);
  z-index: 0;
  pointer-events: none;
}

.grid.completado::before {
  filter: none;
}

/* Escáner */
.grid::after {
  content: "";
  position: absolute;
  left: 0;
  top: -20%;
  width: 100%;
  height: 35px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(56,217,169,.12),
    rgba(56,217,169,.7),
    white,
    rgba(56,217,169,.7),
    transparent
  );
  box-shadow: 0 0 15px rgba(56,217,169,.7);
  z-index: 1;
  pointer-events: none;
  animation: escaner 3s linear infinite;
}

@keyframes escaner {
  from { top: -20%; }
  to { top: 120%; }
}

/* Partículas */
.particula {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #38d9a9;
  box-shadow: 0 0 7px #38d9a9, 0 0 12px white;
  pointer-events: none;
  z-index: 1;
  animation: flotar var(--duracion) ease-out forwards;
}

@keyframes flotar {
  0% {
    transform: translate(0, 0) scale(.4);
    opacity: 0;
  }
  20% { opacity: 1; }
  100% {
    transform: translate(var(--movimiento), var(--altura)) scale(1.4);
    opacity: 0;
  }
}

/* Números por encima de los efectos */
button.numero {
  z-index: 2;
}
  
</style>
</head>

<body>

<!-- PORTADA -->

<section id="portada">

  <div id="galeriaRifas" class="galeria-rifas">
    <p>Cargando rifas...</p>
  </div>

</section>

<!-- TABLERO -->

<section id="tablero" class="oculto">

  <button id="volver">
    ← Volver a la portada
  </button>

  <h2>adivina la imagen</h2>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <p>Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">
    confirmar reserva
  </button>

  <p id="mensaje"></p>

</section>

<script>

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

/* IDENTIFICADOR PARA EVITAR CARGAS ANTIGUAS */

let cargaNumerosId = 0;
let enlaceNotificacion = null;
let reservaCreada = false;
let telefonoPendiente = "";
let comprobandoReserva = false;

async function comprobarReservaPendiente() {
  const telefono = document.getElementById("telefono").value.trim();

  if (!telefono || !raffleId || comprobandoReserva) return;

  comprobandoReserva = true;

  try {
    const respuesta = await fetch(
      API + "/api/reservations/status?raffle_id=" +
      raffleId + "&phone=" + encodeURIComponent(telefono)
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) return;

    reservar.hidden = resultado.pending;
    mensaje.textContent = resultado.pending
      ? "Ya tienes una reserva pendiente de pago. Completa el pago para poder reservar nuevamente."
      : "";

  } catch(error) {
    console.error(error);
  } finally {
    comprobandoReserva = false;
  }
}

const grid = document.getElementById("grid");
const mensaje = document.getElementById("mensaje");
const reservar = document.getElementById("reservar");

const portada = document.getElementById("portada");
const tablero = document.getElementById("tablero");

// NORMALIZAR IMÁGENES

function normalizarImagen(valor) {
  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}

function crearHalftone(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const maxSize = 600;
      const scale = Math.min(1, maxSize / img.width);

      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const original = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const output = ctx.createImageData(
        canvas.width, canvas.height
      );

      const cell = 8;
      const maxRadius = cell * 0.48;

      for (let y = 0; y < canvas.height; y += cell) {
        for (let x = 0; x < canvas.width; x += cell) {

          let total = 0;
          let count = 0;

          for (let dy = 0; dy < cell; dy++) {
            for (let dx = 0; dx < cell; dx++) {
              const px = x + dx;
              const py = y + dy;

              if (px >= canvas.width || py >= canvas.height) continue;

              const i = (py * canvas.width + px) * 4;

              const brightness =
                0.299 * original.data[i] +
                0.587 * original.data[i + 1] +
                0.114 * original.data[i + 2];

              total += brightness;
              count++;
            }
          }

          const brightness = total / count;
          const radius = (1 - brightness / 255) * maxRadius;

          const cx = x + cell / 2;
          const cy = y + cell / 2;

          for (let dy = 0; dy < cell; dy++) {
            for (let dx = 0; dx < cell; dx++) {
              const px = x + dx;
              const py = y + dy;

              if (px >= canvas.width || py >= canvas.height) continue;

              const i = (py * canvas.width + px) * 4;

              const distance = Math.hypot(
                px + 0.5 - cx,
                py + 0.5 - cy
              );

              const inside = distance <= radius;

              const color = inside ? 255 : 25;

              output.data[i] = color;
              output.data[i + 1] = color;
              output.data[i + 2] = color;
              output.data[i + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(output, 0, 0);
      resolve(canvas.toDataURL("image/png"));
    };

    img.onerror = reject;
    img.src = src;
  });
}

// CARGAR TODAS LAS RIFAS ACTIVAS

async function cargarRifas() {
  try {
    const respuesta = await fetch(API + "/api/raffles", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las rifas.");
    }

    const rifas = await respuesta.json();
    const galeria = document.getElementById("galeriaRifas");

    galeria.replaceChildren();

    if (!rifas.length) {
      galeria.textContent = "No hay rifas activas.";
      return;
    }

    rifas.forEach(rifa => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta-rifa";

      const img = document.createElement("img");
      img.src = normalizarImagen(rifa.prize_image);
      img.alt = "Premio de " + rifa.name;

      const info = document.createElement("div");
      info.className = "info-rifa";

      const nombre = document.createElement("h3");
      nombre.textContent = rifa.name;

      info.appendChild(nombre);

      if (rifa.ticket_price != null) {
        const precio = document.createElement("p");
        precio.textContent =
          "Precio por número: " + rifa.ticket_price;
        info.appendChild(precio);
      }

      if (rifa.draw_date) {
        const fecha = document.createElement("p");
        fecha.textContent = "Sorteo: " + rifa.draw_date;
        info.appendChild(fecha);
      }

      tarjeta.appendChild(img);
      tarjeta.appendChild(info);
      tarjeta.onclick = () => abrirRifa(rifa.id);
      galeria.appendChild(tarjeta);
    });

  } catch(error) {
    console.error(error);
    document.getElementById("galeriaRifas").textContent =
      error.message;
  }
}

async function abrirRifa(id) {
  const nuevoId = Number(id);

  if (!Number.isSafeInteger(nuevoId) || nuevoId < 1) return;

  raffleId = nuevoId;

  cargaNumerosId++;
  seleccionados = [];
  numeros = [];

  mensaje.textContent = "";

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  portada.classList.add("oculto");
  tablero.classList.remove("oculto");

  window.scrollTo(0, 0);

  try {
    await cargarRifa();
    await cargarNumeros();

  } catch(error) {
    console.error(error);

    tablero.classList.add("oculto");
    portada.classList.remove("oculto");
  }
}
  
// CARGAR UNA RIFA ESPECÍFICA

async function cargarRifa() {

  if (!raffleId) return;

  const respuesta = await fetch(
    API + "/api/raffle?raffle_id=" + raffleId,
    { cache: "no-store" }
  );

  if (!respuesta.ok) {
    throw new Error("No se pudo cargar la rifa.");
  }

  const rifa = await respuesta.json();

  const imagenOriginal = normalizarImagen(rifa.puzzle_image);
  imagenPuzzle = await crearHalftone(imagenOriginal);
}

document.getElementById("volver").onclick = () => {

  tablero.classList.add("oculto");
  portada.classList.remove("oculto");

  window.scrollTo(0, 0);
};

// CARGAR NÚMEROS DE LA RIFA SELECCIONADA

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    /* OCULTAR EL TABLERO ANTES DE CARGAR */

    grid.classList.add("cargando");
    grid.style.backgroundImage = "none";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    /* IGNORAR RESPUESTAS DE OTRAS CARGAS O RIFAS */

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    /* MOSTRAR SOLO DESPUÉS DE DIBUJAR LOS 100 NÚMEROS */

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    grid.style.backgroundImage = "none";
    
    grid.classList.add("cargando");
    
    mensaje.textContent = "No se pudo cargar el tablero. Intenta nuevamente.";
    
    console.error(error);
  }
}

// DIBUJAR TABLERO

function dibujarTablero() {

  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      dibujarTablero();
      const botonRipple = grid.children[Number(n)];
      crearRipple(botonRipple);
    };

    grid.appendChild(b);
  }

  /* APLICAR EL PUZZLE SOLO DESPUÉS DE CREAR LOS 100 BOTONES */

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle ? 'url("' + imagenPuzzle + '")' : "none"
  );
  
  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;
  
  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}

function crearRipple(boton) {
  const rect = boton.getBoundingClientRect();
  const tableroRect = grid.getBoundingClientRect();

  const x = rect.left + rect.width / 2 - tableroRect.left;
  const y = rect.top + rect.height / 2 - tableroRect.top;

  const diametro = Math.hypot(
    tableroRect.width,
    tableroRect.height
  ) * 2.2;

  const onda = document.createElement("div");

  onda.className = "ripple-wave";
  onda.style.width = diametro + "px";
  onda.style.height = diametro + "px";
  onda.style.left = x + "px";
  onda.style.top = y + "px";

  grid.appendChild(onda);

  onda.addEventListener("animationend", () => {
    onda.remove();
  }, { once: true });
}

// RESERVAR NÚMEROS

reservar.onclick = async () => {

  // SEGUNDO CLIC: ABRIR WHATSAPP
  if (enlaceNotificacion) {
    window.open(enlaceNotificacion, "_blank");
    enlaceNotificacion = null;
    reservar.textContent = "Confirmar reserva";
    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const contactType = /[a-zA-Z@_]/.test(telefono)
    ? "username"
    : "phone";

  mensaje.textContent = "";

  if (!raffleId) {
    mensaje.textContent = "Selecciona una rifa.";
    return;
  }

  if (!seleccionados.length) {
    mensaje.textContent = "Selecciona al menos un número.";
    return;
  }

  if (!nombre || !telefono) {
    mensaje.textContent = "Completa tu nombre y WhatsApp.";
    return;
  }

  reservar.disabled = true;
  reservar.textContent = "Procesando reserva...";

  try {

    const respuesta = await fetch(
      API + "/api/reservations",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          raffle_id: raffleId,
          name: nombre,
          phone: telefono,
          contactType: contactType,
          numbers: seleccionados
        })
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.error || "No se pudo completar la reserva"
      );
    }

    mensaje.replaceChildren();

    const confirmacion = document.createElement("p");

    confirmacion.textContent =
      "¡Reserva creada! Código: " +
      resultado.reservation.reservation_code +
      ". Tienes 72 horas para realizar el pago.";

    mensaje.appendChild(confirmacion);

    enlaceNotificacion = resultado.admin_whatsapp_url;

    seleccionados = [];

    await cargarNumeros();

    if (enlaceNotificacion) {
      reservar.textContent = "Notificar por WhatsApp";
      reservar.disabled = false;
    } else {
      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;
      mensaje.appendChild(
        document.createTextNode(
          " No se pudo generar el enlace de WhatsApp."
        )
      );
    }

  } catch(error) {

    mensaje.textContent = error.message;
    reservar.textContent = "Confirmar reserva";
    reservar.disabled = false;

    await cargarNumeros();
  }
};

document.getElementById("telefono").addEventListener(
  "change",
  comprobarReservaPendiente
);

setInterval(comprobarReservaPendiente, 10000);

function crearParticula() {
  if (
    grid.classList.contains("cargando") ||
    tablero.classList.contains("oculto") ||
    grid.classList.contains("completado")
  ) return;

  if (grid.querySelectorAll(".particula").length >= 5000) return;

  const particula = document.createElement("div");
  particula.className = "particula";

  particula.style.left = Math.random() * 100 + "%";
  particula.style.top = Math.random() * 100 + "%";

  particula.style.setProperty(
    "--duracion",
    (3 + Math.random() * 3) + "s"
  );

  particula.style.setProperty(
    "--movimiento",
    (Math.random() * 70 - 35) + "px"
  );

  particula.style.setProperty(
    "--altura",
    (-30 - Math.random() * 70) + "px"
  );

  grid.appendChild(particula);

  particula.addEventListener("animationend", () => {
    particula.remove();
  }, { once: true });
}

setInterval(crearParticula, 0.5);

// INICIO

cargarRifas();

setInterval(() => {

  if (!tablero.classList.contains("oculto") && raffleId) {
    cargarNumeros();
  }

}, 20000);

</script>
