<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>

/* =====================================================
   01. CONFIGURACIÓN GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #080c14;
  color: #f5ead0;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1, h2 {
  color: #e8c778;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.estado,
#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

#portada,
#tablero {
  max-width: 600px;
  margin: auto;
}

.oculto {
  display: none !important;
}

/* =====================================================
   02. GALERÍA
===================================================== */

.galeria-rifas {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 5px 25px;
  scroll-snap-type: x mandatory;
}

.tarjeta-rifa {
  flex: 0 0 82%;
  max-width: 340px;
  background: #111c2b;
  border: 1px solid #a88745;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  scroll-snap-align: center;
}

.tarjeta-rifa img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #172233;
}

.tarjeta-rifa .info-rifa {
  padding: 14px;
}

.tarjeta-rifa h3 {
  color: #e8c778;
}

.tarjeta-rifa p {
  color: #b8c5d6;
}

/* =====================================================
   03. TABLERO
===================================================== */

.grid {
  position: relative;
  isolation: isolate;
  overflow: hidden;

  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 5px;

  width: 100%;
  max-width: 500px;
  aspect-ratio: 1;

  margin: 25px auto;
  padding: 8px;

  background: #101722;
  border: 1px solid #b9974b;
  border-radius: 15px;

  box-shadow:
    0 0 12px rgba(218,174,78,.25),
    0 0 35px rgba(218,174,78,.12),
    inset 0 0 25px rgba(0,0,0,.9);
}

.grid.cargando {
  visibility: hidden;
}

.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;

  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  filter: blur(2px) brightness(.65);
  transform: scale(1.04);
  pointer-events: none;
}

.grid.completado::before {
  filter: none;
}

/* =====================================================
   04. NÚMEROS
===================================================== */

button.numero {
  position: relative;
  z-index: 2;

  min-width: 0;
  aspect-ratio: 1;
  padding: 0;

  border: 1px solid rgba(224,190,112,.65);
  border-radius: 7px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.17),
    rgba(34,42,53,.82) 45%,
    rgba(7,12,20,.96)
  );

  color: #f5e5bc;
  font-size: clamp(10px, 3.2vw, 17px);
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    inset 1px 1px 3px rgba(255,255,255,.2),
    inset -2px -2px 5px rgba(0,0,0,.8),
    0 2px 5px rgba(0,0,0,.7);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

button.numero:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: #ffe5a0;

  box-shadow:
    0 0 8px rgba(255,211,119,.7),
    0 0 18px rgba(255,190,70,.35),
    inset 0 0 8px rgba(255,255,255,.25);
}

button.numero.seleccionado {
  background: linear-gradient(
    145deg,
    #fff0b3,
    #d8a83e 45%,
    #805515
  );

  color: #211707;
  border-color: #fff0b3;

  box-shadow:
    0 0 8px #e8bd58,
    0 0 20px rgba(255,193,65,.65),
    inset 0 0 8px rgba(255,255,255,.6);
}

button.numero.reservado {
  background: linear-gradient(
    145deg,
    #ff7777,
    #a81425 50%,
    #4c0712
  );

  color: white;
  border-color: #ff7777;

  box-shadow:
    0 0 8px rgba(255,40,55,.65),
    inset 0 0 7px rgba(255,255,255,.2);

  cursor: default;
}

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  box-shadow: none;
  cursor: default;
}

button.numero:disabled {
  opacity: 1;
}

/* =====================================================
   05. EFECTOS DEL TABLERO
===================================================== */

/* Escáner */

.grid::after {
  content: "";
  position: absolute;
  z-index: 1;
  pointer-events: none;

  left: 0;
  top: -20%;

  width: 100%;
  height: 45px;

  background: linear-gradient(
    to bottom,
    transparent,
    rgba(255,195,75,.12),
    rgba(255,215,125,.7),
    white,
    rgba(255,195,75,.5),
    transparent
  );

  box-shadow: 0 0 18px rgba(255,190,70,.6);

  animation: escaner 6s linear infinite;
}

@keyframes escaner {
  from { top: -20%; }
  to { top: 120%; }
}

/* Ripple */

.ripple-wave {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  border-radius: 50%;

  background: radial-gradient(
    circle,
    transparent 42%,
    rgba(255,210,115,.5) 47%,
    white 50%,
    rgba(255,190,70,.7) 53%,
    transparent 62%
  );

  transform: translate(-50%, -50%) scale(0);
  animation: rippleExpand 1.35s ease-out forwards;
}

@keyframes rippleExpand {
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
  }
}

/* Partículas */

.particula {
  position: absolute;
  z-index: 1;

  width: 8px;
  height: 8px;
  border-radius: 50%;

  background: #ffd783;

  box-shadow:
    0 0 7px #ffd700,
    0 0 15px #ffbf00,
    0 0 25px #fff2a0;

  pointer-events: none;
  animation: flotar var(--duracion) linear forwards;
}

@keyframes flotar {
  0% {
    transform: translate3d(0,0,0) scale(.3);
    opacity: 0;
  }

  12% { opacity: 1; }
  85% { opacity: .85; }

  100% {
    transform:
      translate3d(var(--movimiento),var(--altura),0)
      scale(1.5);
    opacity: 0;
  }
}

/* =====================================================
   06. DESTELLO 1: RUBÍ
===================================================== */

.destello-rubi {
  position: absolute;
  z-index: 3;

  left: 50%;
  top: 0;

  width: 65px;
  height: 50px;

  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.9) 5%,
    rgba(255,80,80,.9) 15%,
    rgba(190,0,35,.7) 38%,
    transparent 70%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #d40028);

  transform: translate(-50%, -50%);
  animation: nadoPez 8s ease-in-out infinite;
}

/* =====================================================
   07. DESTELLO 2: PARPADEANTE
===================================================== */

.destello-rapido {
  position: absolute;
  z-index: 3;

  width: 100px;
  height: 100px;

  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.9) 5%,
    rgba(255,80,80,.9) 15%,
    rgba(190,0,35,.7) 38%,
    transparent 70%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #d40028);

  transform: translate(-50%, -50%);

  animation: parpadeoRapido .10s steps(2,end) infinite;
}

@keyframes parpadeoRapido {
  0%, 100% { opacity: 1; }
  50% { opacity: .12; }
}

/* =====================================================
   08. DESTELLO 3: TURQUESA
===================================================== */

.destello-turquesa {
  position: absolute;
  z-index: 4;

  width: 55px;
  height: 42px;

  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.95) 8%,
    rgba(56,217,169,.9) 25%,
    rgba(56,217,169,.4) 48%,
    transparent 72%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #38d9a9);

  transform: translate(-50%, -50%);
}

/* =====================================================
   09. BOTONES Y FORMULARIOS
===================================================== */

#volver {
  background: #172233;
  color: #e8c778;
  border: 1px solid #a88745;
  padding: 12px 22px;
  border-radius: 8px;
  cursor: pointer;
}

#reservar,
#participar {
  background: linear-gradient(145deg,#e8c778,#a87926);
  color: #17110a;
  border: 1px solid #ffe6a0;
  padding: 15px 25px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

input,
#selectorRifa {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 1px solid #8e7444;
  background: #172233;
  color: white;
  font-size: 16px;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #e8c778;
  font-size: 15px;
  margin: 12px;
}

/* =====================================================
   10. RESPONSIVE
===================================================== */

@media(max-width:450px) {
  body { padding: 12px; }
  .grid { gap: 3px; padding: 5px; }
}

</style>
</head>

<body>

<!-- =====================================================
     11. HTML
===================================================== -->

<section id="portada">

  <div id="galeriaRifas" class="galeria-rifas">
    <p>Cargando rifas...</p>
  </div>

</section>

<section id="tablero" class="oculto">

  <button id="volver">← Volver a la portada</button>

  <h2>adivina la imagen</h2>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <p>Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">confirmar reserva</button>

  <p id="mensaje"></p>

</section>


<script>

/* =====================================================
   12. CONFIGURACIÓN GLOBAL
===================================================== */

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

const grid = document.getElementById("grid");
const tablero = document.getElementById("tablero");
const portada = document.getElementById("portada");
const mensaje = document.getElementById("mensaje");
const reservar = document.getElementById("reservar");

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

let cargaNumerosId = 0;
let enlaceNotificacion = null;
let reservaCreada = false;
let telefonoPendiente = "";
let comprobandoReserva = false;


/* =====================================================
   13. MÓDULO INDEPENDIENTE: DESTELLO RUBÍ
===================================================== */

const DestelloRubi = (() => {

  /* Estado privado */

  const elemento = document.createElement("div");
  elemento.className = "destello-rubi";

  grid.appendChild(elemento);

  let x = 10;
  let y = 20;

  let destinoX = 80;
  let destinoY = 70;

  let velocidad = 0.012;

  let ultimoMovimiento = 0;
  let pausa = false;

  let faseOndulacion = 0;

  /* Destino aleatorio */

  function nuevoDestino() {

    destinoX = -10 + Math.random() * 110;
    destinoY = -10 + Math.random() * 110;

    velocidad = 0.006 + Math.random() * 0.036;

    pausa = Math.random() < 0.15;

    ultimoMovimiento =
      performance.now() + 1500 + Math.random() * 3000;
  }

  /* Movimiento independiente */

  function actualizar() {

    if (
      !tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")
    ) {

      if (performance.now() > ultimoMovimiento) {
        nuevoDestino();
      }

      if (!pausa) {

        faseOndulacion += 0.055;

        const distanciaX = destinoX - x;
        const distanciaY = destinoY - y;

        x += distanciaX * velocidad;
        y += distanciaY * velocidad;

        const ondulacionX =
          Math.sin(faseOndulacion) * 2.5 +
          Math.sin(faseOndulacion * 0.45) * 1.5;

        const ondulacionY =
          Math.cos(faseOndulacion * 0.7) * 2.5 +
          Math.sin(faseOndulacion * 0.35) * 1.5;

        elemento.style.left = (x + ondulacionX) + "%";
        elemento.style.top = (y + ondulacionY) + "%";
      }

      elemento.style.opacity = 1;

      elemento.style.filter =
        "brightness(1.2) drop-shadow(0 0 7px white) drop-shadow(0 0 16px #38d9a9)";
    }

    requestAnimationFrame(actualizar);
  }

  /* Interfaz pública para colisiones */

  function obtenerPosicion() {
    return {
      elemento,
      visible: true
    };
  }

  function recibirColision(vx, vy) {

    destinoX = Math.max(-10, Math.min(110, x + vx * 65));
    destinoY = Math.max(-10, Math.min(110, y + vy * 65));

    pausa = false;

    ultimoMovimiento = performance.now() + 3000;
  }

  function iniciar() {
    nuevoDestino();
    actualizar();
  }

  return {
    iniciar,
    obtenerPosicion,
    recibirColision
  };

})();


/* =====================================================
   14. MÓDULO INDEPENDIENTE: DESTELLO PARPADEANTE
===================================================== */

const DestelloRapido = (() => {

  /* Estado privado */

  const elemento = document.createElement("div");
  elemento.className = "destello-rapido";
  elemento.style.display = "none";

  grid.appendChild(elemento);

  let x = 0;
  let y = 0;

  let destinoX = 0;
  let destinoY = 0;

  let velocidad = 0.04;

  let proximaAparicion = performance.now() + 2000;
  let visible = false;

  /* Comenzar recorrido */

  function iniciarRecorrido() {

    const lado = Math.floor(Math.random() * 4);

    if (lado === 0) {

      x = -15;
      y = Math.random() * 100;

      destinoX = 115;
      destinoY = Math.random() * 100;

    } else if (lado === 1) {

      x = 115;
      y = Math.random() * 100;

      destinoX = -15;
      destinoY = Math.random() * 100;

    } else if (lado === 2) {

      x = Math.random() * 100;
      y = -15;

      destinoX = Math.random() * 100;
      destinoY = 115;

    } else {

      x = Math.random() * 100;
      y = 115;

      destinoX = Math.random() * 100;
      destinoY = -15;
    }

    velocidad = 0.015 + Math.random() * 0.015;

    elemento.style.left = x + "%";
    elemento.style.top = y + "%";

    elemento.style.display = "block";

    visible = true;
  }

  /* Movimiento independiente */

  function actualizar() {

    const ahora = performance.now();

    if (
      !tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")
    ) {

      if (!visible && ahora >= proximaAparicion) {
        iniciarRecorrido();
      }

      if (visible) {

        x += (destinoX - x) * velocidad;
        y += (destinoY - y) * velocidad;

        elemento.style.left = x + "%";
        elemento.style.top = y + "%";

        const distancia = Math.hypot(
          destinoX - x,
          destinoY - y
        );

        if (distancia < 1) {

          elemento.style.display = "none";

          visible = false;

          proximaAparicion =
            ahora + 5000 + Math.random() * 7000;
        }
      }
    }

    requestAnimationFrame(actualizar);
  }

  /* Interfaz pública */

  function obtenerPosicion() {
    return {
      elemento,
      visible
    };
  }

  function recibirColision(vx, vy) {

    destinoX = Math.max(-15, Math.min(115, x + vx * 100));
    destinoY = Math.max(-15, Math.min(115, y + vy * 100));

    velocidad = 0.025 + Math.random() * 0.015;
  }

  function iniciar() {
    actualizar();
  }

  return {
    iniciar,
    obtenerPosicion,
    recibirColision
  };

})();


/* =====================================================
   15. MÓDULO INDEPENDIENTE: DESTELLO TURQUESA
===================================================== */

const DestelloTurquesa = (() => {

  /* Estado privado */

  const elemento = document.createElement("div");
  elemento.className = "destello-turquesa";

  grid.appendChild(elemento);

  let x = -15;
  let y = 50;

  let destinoX = 50;
  let destinoY = 50;

  let velocidad = 30;

  let modo = "entrando";

  let pausaHasta = 0;
  let proximoCambio = 0;

  let ultimoTiempo = performance.now();

  /* Destino aleatorio */

  function destinoAleatorio() {

    destinoX = 8 + Math.random() * 84;
    destinoY = 8 + Math.random() * 84;

    velocidad = 18 + Math.random() * 22;

    modo = "moviendo";

    proximoCambio =
      performance.now() + 2500 + Math.random() * 3500;
  }

  /* Entrada desde los bordes */

  function entrar() {

    const lado = Math.floor(Math.random() * 4);

    if (lado === 0) {

      x = -15;
      y = Math.random() * 100;

    } else if (lado === 1) {

      x = 115;
      y = Math.random() * 100;

    } else if (lado === 2) {

      x = Math.random() * 100;
      y = -15;

    } else {

      x = Math.random() * 100;
      y = 115;
    }

    destinoX = 8 + Math.random() * 84;
    destinoY = 8 + Math.random() * 84;

    velocidad = 30;
    modo = "entrando";
  }

  /* Salida hacia los bordes */

  function salir() {

    const lado = Math.floor(Math.random() * 4);

    if (lado === 0) {

      destinoX = -15;
      destinoY = Math.random() * 100;

    } else if (lado === 1) {

      destinoX = 115;
      destinoY = Math.random() * 100;

    } else if (lado === 2) {

      destinoX = Math.random() * 100;
      destinoY = -15;

    } else {

      destinoX = Math.random() * 100;
      destinoY = 115;
    }

    velocidad = 35;
    modo = "saliendo";
  }

  /* Perseguir un número */

  function perseguir(boton) {

    if (!boton || !boton.isConnected) return;

    const rect = boton.getBoundingClientRect();
    const tableroRect = grid.getBoundingClientRect();

    if (!tableroRect.width || !tableroRect.height) return;

    destinoX =
      ((rect.left + rect.width / 2 - tableroRect.left) /
      tableroRect.width) * 100;

    destinoY =
      ((rect.top + rect.height / 2 - tableroRect.top) /
      tableroRect.height) * 100;

    velocidad = 200;
    modo = "persiguiendo";
  }

  /* Movimiento independiente */

  function actualizar() {

    const ahora = performance.now();

    const delta = Math.min(
      (ahora - ultimoTiempo) / 1000,
      0.05
    );

    ultimoTiempo = ahora;

    if (
      !tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")
    ) {

      if (modo === "esperando") {

        if (ahora >= pausaHasta) {
          destinoAleatorio();
        }

      } else {

        if (
          modo === "moviendo" &&
          ahora >= proximoCambio
        ) {

          if (Math.random() < 0.25) {
            salir();
          } else {
            destinoAleatorio();
          }
        }

        const dx = destinoX - x;
        const dy = destinoY - y;

        const distancia = Math.hypot(dx, dy);
        const paso = velocidad * delta;

        if (distancia <= paso || distancia < 0.01) {

          x = destinoX;
          y = destinoY;

          if (modo === "saliendo") {

            entrar();

          } else if (modo === "persiguiendo") {

            modo = "esperando";
            pausaHasta = ahora + 500;

          } else {

            destinoAleatorio();
          }

        } else {

          x += (dx / distancia) * paso;
          y += (dy / distancia) * paso;
        }
      }

      elemento.style.left = x + "%";
      elemento.style.top = y + "%";
    }

    requestAnimationFrame(actualizar);
  }

  /* Interfaz pública */

  function obtenerPosicion() {
    return {
      elemento,
      visible: true
    };
  }

  function recibirColision(vx, vy) {

    destinoX = Math.max(8, Math.min(84, x + vx * 65));
    destinoY = Math.max(8, Math.min(84, y + vy * 65));

    velocidad = 35 + Math.random() * 20;

    modo = "moviendo";

    proximoCambio = performance.now() + 3000;
  }

  function iniciar() {
    entrar();
    actualizar();
  }

  return {
    iniciar,
    obtenerPosicion,
    recibirColision,
    perseguir
  };

})();


/* =====================================================
   16. GESTOR INDEPENDIENTE DE COLISIONES
===================================================== */

/*
   Este gestor NO controla el movimiento interno
   de ningún destello.

   Solamente:
   1. Obtiene sus posiciones.
   2. Detecta colisiones.
   3. Calcula la dirección de separación.
   4. Comunica el resultado mediante su interfaz pública.
*/

const GestorColisiones = (() => {

  const distanciaColision = 0.3;

  const colisionesActivas = new Set();

  const destellos = [
    DestelloRubi,
    DestelloRapido,
    DestelloTurquesa
  ];

  function obtenerPosiciones() {

    const gridRect = grid.getBoundingClientRect();

    return destellos.map((destello, id) => {

      const estado = destello.obtenerPosicion();

      if (!estado.visible) return null;

      const rect = estado.elemento.getBoundingClientRect();

      return {
        id,
        x: rect.left + rect.width / 2 - gridRect.left,
        y: rect.top + rect.height / 2 - gridRect.top,
        radio: Math.max(rect.width, rect.height) / 2
      };
    });
  }

  function calcularDireccion(destello, centroX, centroY) {

    const dx = destello.x - centroX;
    const dy = destello.y - centroY;

    const distancia = Math.hypot(dx, dy) || 1;

    return {
      x: dx / distancia,
      y: dy / distancia
    };
  }

  function detectar() {

    if (
      !tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")
    ) {

      const posiciones = obtenerPosiciones();

      const implicados = new Set();
      const paresDetectados = new Set();

      /* Detectar pares de destellos */

      for (let i = 0; i < posiciones.length; i++) {

        for (let j = i + 1; j < posiciones.length; j++) {

          const a = posiciones[i];
          const b = posiciones[j];

          if (!a || !b) continue;

          const dx = a.x - b.x;
          const dy = a.y - b.y;

          const distancia = Math.hypot(dx, dy);
          const limite = a.radio + b.radio;

          const par = i + "-" + j;

          if (distancia < limite * distanciaColision) {

            paresDetectados.add(par);

            if (!colisionesActivas.has(par)) {

              implicados.add(i);
              implicados.add(j);
            }
          }
        }
      }

      /* Liberar colisiones anteriores */

      for (const par of colisionesActivas) {

        if (!paresDetectados.has(par)) {
          colisionesActivas.delete(par);
        }
      }

      /* Registrar colisiones nuevas */

      for (const par of paresDetectados) {
        colisionesActivas.add(par);
      }

      /* Calcular centro de colisión */

      if (implicados.size > 0) {

        let centroX = 0;
        let centroY = 0;

        implicados.forEach(id => {

          centroX += posiciones[id].x;
          centroY += posiciones[id].y;
        });

        centroX /= implicados.size;
        centroY /= implicados.size;

        /* Comunicar a cada módulo su nueva dirección */

        implicados.forEach(id => {

          const direccion = calcularDireccion(
            posiciones[id],
            centroX,
            centroY
          );

          destellos[id].recibirColision(
            direccion.x,
            direccion.y
          );
        });
      }
    }

    requestAnimationFrame(detectar);
  }

  function iniciar() {
    detectar();
  }

  return {
    iniciar
  };

})();


/* =====================================================
   17. INICIALIZACIÓN DEL SISTEMA DE DESTELLOS
===================================================== */

/*
   Cada módulo inicia su propio ciclo de animación.
   El gestor de colisiones tiene un ciclo independiente.
*/

function iniciarSistemaDestellos() {

  DestelloRubi.iniciar();

  DestelloRapido.iniciar();

  DestelloTurquesa.iniciar();

  GestorColisiones.iniciar();
}


/* =====================================================
   18. GESTIÓN DE IMÁGENES
===================================================== */

function normalizarImagen(valor) {

  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}


function crearHalftone(src) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => {

      const canvas = document.createElement("canvas");

      const ctx = canvas.getContext(
        "2d",
        { willReadFrequently: true }
      );

      const maxSize = 600;

      const scale = Math.min(1, maxSize / img.width);

      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const original = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const output = ctx.createImageData(
        canvas.width, canvas.height
      );

      const cell = 8;
      const maxRadius = cell * 0.48;

      for (let y = 0; y < canvas.height; y += cell) {

        for (let x = 0; x < canvas.width; x += cell) {

          let total = 0;
          let count = 0;

          for (let dy = 0; dy < cell; dy++) {

            for (let dx = 0; dx < cell; dx++) {

              const px = x + dx;
              const py = y + dy;

              if (
                px >= canvas.width ||
                py >= canvas.height
              ) continue;

              const i = (py * canvas.width + px) * 4;

              const brightness =
                0.299 * original.data[i] +
                0.587 * original.data[i + 1] +
                0.114 * original.data[i + 2];

              total += brightness;
              count++;
            }
          }

          const brightness = total / count;
          const radius = (1 - brightness / 255) * maxRadius;

          const cx = x + cell / 2;
          const cy = y + cell / 2;

          for (let dy = 0; dy < cell; dy++) {

            for (let dx = 0; dx < cell; dx++) {

              const px = x + dx;
              const py = y + dy;

              if (
                px >= canvas.width ||
                py >= canvas.height
              ) continue;

              const i = (py * canvas.width + px) * 4;

              const distance = Math.hypot(
                px + 0.5 - cx,
                py + 0.5 - cy
              );

              const inside = distance <= radius;

              const color = inside ? 255 : 25;

              output.data[i] = color;
              output.data[i + 1] = color;
              output.data[i + 2] = color;
              output.data[i + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(output, 0, 0);

      resolve(canvas.toDataURL("image/png"));
    };

    img.onerror = reject;
    img.src = src;
  });
}


/* =====================================================
   19. GALERÍA DE RIFAS
===================================================== */

async function cargarRifas() {

  try {

    const respuesta = await fetch(API + "/api/raffles", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las rifas.");
    }

    const rifas = await respuesta.json();

    const galeria = document.getElementById("galeriaRifas");

    galeria.replaceChildren();

    if (!rifas.length) {
      galeria.textContent = "No hay rifas activas.";
      return;
    }

    rifas.forEach(rifa => {

      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta-rifa";

      const img = document.createElement("img");
      img.src = normalizarImagen(rifa.prize_image);
      img.alt = "Premio de " + rifa.name;

      const info = document.createElement("div");
      info.className = "info-rifa";

      const nombre = document.createElement("h3");
      nombre.textContent = rifa.name;

      info.appendChild(nombre);

      if (rifa.ticket_price != null) {

        const precio = document.createElement("p");

        precio.textContent =
          "Precio por número: " + rifa.ticket_price;

        info.appendChild(precio);
      }

      if (rifa.draw_date) {

        const fecha = document.createElement("p");

        fecha.textContent = "Sorteo: " + rifa.draw_date;

        info.appendChild(fecha);
      }

      tarjeta.appendChild(img);
      tarjeta.appendChild(info);

      tarjeta.onclick = () => abrirRifa(rifa.id);

      galeria.appendChild(tarjeta);
    });

  } catch(error) {

    console.error(error);

    document.getElementById("galeriaRifas").textContent =
      error.message;
  }
}


/* =====================================================
   20. ABRIR Y CARGAR RIFAS
===================================================== */

async function abrirRifa(id) {

  const nuevoId = Number(id);

  if (!Number.isSafeInteger(nuevoId) || nuevoId < 1) return;

  raffleId = nuevoId;

  cargaNumerosId++;

  seleccionados = [];
  numeros = [];

  mensaje.textContent = "";

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";

  grid.querySelectorAll("*").forEach(elemento => {

    if (
      elemento !== document.querySelector(".destello-rubi") &&
      elemento !== document.querySelector(".destello-rapido") &&
      elemento !== document.querySelector(".destello-turquesa")
    ) {
      elemento.remove();
    }
  });

  portada.classList.add("oculto");
  tablero.classList.remove("oculto");

  window.scrollTo(0, 0);

  try {

    await cargarRifa();
    await cargarNumeros();

  } catch(error) {

    console.error(error);

    tablero.classList.add("oculto");
    portada.classList.remove("oculto");
  }
}


async function cargarRifa() {

  if (!raffleId) return;

  const respuesta = await fetch(
    API + "/api/raffle?raffle_id=" + raffleId,
    { cache: "no-store" }
  );

  if (!respuesta.ok) {
    throw new Error("No se pudo cargar la rifa.");
  }

  const rifa = await respuesta.json();

  const imagenOriginal = normalizarImagen(rifa.puzzle_image);

  imagenPuzzle = await crearHalftone(imagenOriginal);
}


document.getElementById("volver").onclick = () => {

  tablero.classList.add("oculto");
  portada.classList.remove("oculto");

  window.scrollTo(0, 0);
};


/* =====================================================
   21. CARGA DE NÚMEROS
===================================================== */

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    if (grid.children.length <= 3) {
      grid.classList.add("cargando");
    }

    grid.style.backgroundImage = "none";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {

      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    grid.style.backgroundImage = "none";
    grid.classList.add("cargando");

    mensaje.textContent =
      "No se pudo cargar el tablero. Intenta nuevamente.";

    console.error(error);
  }
}


/* =====================================================
   22. DIBUJAR TABLERO
===================================================== */

function dibujarTablero() {

  grid.style.backgroundImage = "none";

  grid.querySelectorAll(
    "button.numero"
  ).forEach(elemento => elemento.remove());

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
      b.style.visibility = "hidden";
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {

        seleccionados = seleccionados.filter(
          x => x !== n
        );

      } else {

        seleccionados.push(n);
      }

      dibujarTablero();

      const botonRipple = [
        ...grid.querySelectorAll("button.numero")
      ].find(b => b.textContent === n);

      crearRipple(botonRipple);

      /* El tercer destello recibe la orden de persecución */

      DestelloTurquesa.perseguir(botonRipple);
    };

    grid.appendChild(b);
  }

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle
      ? 'url("' + imagenPuzzle + '")'
      : "none"
  );

  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;

  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}


/* =====================================================
   23. RIPPLE
===================================================== */

function crearRipple(boton) {

  const rect = boton.getBoundingClientRect();
  const tableroRect = grid.getBoundingClientRect();

  const x =
    rect.left + rect.width / 2 - tableroRect.left;

  const y =
    rect.top + rect.height / 2 - tableroRect.top;

  const diametro = Math.hypot(
    tableroRect.width,
    tableroRect.height
  ) * 2.2;

  const onda = document.createElement("div");

  onda.className = "ripple-wave";

  onda.style.width = diametro + "px";
  onda.style.height = diametro + "px";

  onda.style.left = x + "px";
  onda.style.top = y + "px";

  grid.appendChild(onda);

  onda.addEventListener("animationend", () => {
    onda.remove();
  }, { once: true });
}


/* =====================================================
   24. RESERVAS
===================================================== */

async function comprobarReservaPendiente() {

  const telefono =
    document.getElementById("telefono").value.trim();

  if (!telefono || !raffleId || comprobandoReserva) return;

  comprobandoReserva = true;

  try {

    const respuesta = await fetch(
      API + "/api/reservations/status?raffle_id=" +
      raffleId + "&phone=" + encodeURIComponent(telefono)
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) return;

    if (!enlaceNotificacion) {
      reservar.hidden = resultado.pending;
    }

    if (!resultado.pending && enlaceNotificacion) {

      enlaceNotificacion = null;

      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;
    }

    mensaje.textContent = resultado.pending
      ? resultado.message
      : "";

  } catch(error) {

    console.error(error);

  } finally {

    comprobandoReserva = false;
  }
}


/* Crear reserva */

reservar.onclick = async () => {

  if (enlaceNotificacion) {

    window.open(enlaceNotificacion, "_blank");

    enlaceNotificacion = null;

    reservar.textContent = "Confirmar reserva";

    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const contactType = /[a-zA-Z@_]/.test(telefono)
    ? "username"
    : "phone";

  mensaje.textContent = "";

  if (!raffleId) {
    mensaje.textContent = "Selecciona una rifa.";
    return;
  }

  if (!seleccionados.length) {
    mensaje.textContent = "Selecciona al menos un número.";
    return;
  }

  if (!nombre || !telefono) {
    mensaje.textContent = "Completa tu nombre y WhatsApp.";
    return;
  }

  reservar.disabled = true;
  reservar.textContent = "Procesando reserva...";

  try {

    const respuesta = await fetch(
      API + "/api/reservations",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          raffle_id: raffleId,
          name: nombre,
          phone: telefono,
          contactType: contactType,
          numbers: seleccionados
        })
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {

      if (
        respuesta.status === 409 &&
        resultado.message
      ) {

        mensaje.textContent = resultado.message;

        await comprobarReservaPendiente();

        return;
      }

      throw new Error(
        resultado.error ||
        "No se pudo completar la reserva"
      );
    }

    mensaje.replaceChildren();

    enlaceNotificacion = resultado.admin_whatsapp_url;

    reservar.hidden = false;

    seleccionados = [];

    await cargarNumeros();

    if (enlaceNotificacion) {

      reservar.textContent = "Notificar por WhatsApp";
      reservar.disabled = false;

    } else {

      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;

      mensaje.appendChild(
        document.createTextNode(
          " No se pudo generar el enlace de WhatsApp."
        )
      );
    }

  } catch(error) {

    mensaje.textContent = error.message;

    reservar.textContent = "Confirmar reserva";
    reservar.disabled = false;

    await cargarNumeros();
  }
};


/* =====================================================
   25. COMPROBACIÓN AUTOMÁTICA DE RESERVAS
===================================================== */

document.getElementById("telefono").addEventListener(
  "change",
  comprobarReservaPendiente
);

setInterval(comprobarReservaPendiente, 10000);


/* =====================================================
   26. PARTÍCULAS
===================================================== */

function crearParticula() {

  if (
    grid.classList.contains("cargando") ||
    tablero.classList.contains("oculto") ||
    grid.classList.contains("completado")
  ) {
    return;
  }

  if (
    grid.querySelectorAll(".particula").length >= 120
  ) {
    return;
  }

  const particula = document.createElement("div");

  particula.className = "particula";

  particula.style.left = Math.random() * 100 + "%";
  particula.style.top = Math.random() * 100 + "%";

  particula.style.setProperty(
    "--duracion",
    (5 + Math.random() * 3) + "s"
  );

  particula.style.setProperty(
    "--movimiento",
    (Math.random() * 100 - 50) + "px"
  );

  particula.style.setProperty(
    "--altura",
    (-40 - Math.random() * 100) + "px"
  );

  grid.appendChild(particula);

  particula.addEventListener("animationend", () => {
    particula.remove();
  }, { once: true });
}


/* =====================================================
   27. INICIALIZACIÓN GENERAL
===================================================== */

/* Iniciar los cuatro componentes visuales */

iniciarSistemaDestellos();

/* Cargar rifas */

cargarRifas();

/* Partículas */

setInterval(crearParticula, 65);

/* Actualizar tablero cada 20 segundos */

setInterval(() => {

  if (
    !tablero.classList.contains("oculto") &&
    raffleId
  ) {
    cargarNumeros();
  }

}, 20000);

</script>
