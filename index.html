<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1 { color: #38d9a9; }

.estado {
  margin: 15px;
  color: #b8c5d6;
  font-size: 14px;
}

#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

#portada, #tablero {
  max-width: 600px;
  margin: auto;
}

#imagenPremio {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  margin: 20px auto;
  border-radius: 12px;
}

#selectorRifa {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 20px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
  background: #263449;
  color: white;
}

#participar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 17px 35px;
  border-radius: 9px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  margin: 20px;
}

#volver {
  background: #263449;
  color: white;
  border: 1px solid #526078;
  padding: 12px 22px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  margin: 12px;
}

.oculto { display: none !important; }

.grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 0;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  margin: 25px auto;
  background-color: #263449;
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  border: 1px solid #526078;
}

/* OCULTAR EL TABLERO DURANTE LA CARGA */

.grid.cargando {
  visibility: hidden;
}

button.numero {
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 0;
  background: #263449;
  color: white;
  font-size: clamp(10px, 3.2vw, 17px);
  cursor: pointer;
}

button.numero.seleccionado {
  background: #38d9a9;
  color: #101827;
}

button.numero.reservado {
  background: #e05252;
  color: white;
  cursor: not-allowed;
}

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  cursor: default;
}

button.numero:disabled {
  opacity: 1;
}

input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
}

#reservar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #38d9a9;
  font-size: 15px;
  margin: 12px;
}

@media(max-width:450px) {
  body { padding: 12px; }
}
  .grid {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background-image: none !important;
}

.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(5px) brightness(0.5);
  transform: scale(1.05);
  z-index: -1;
}

.grid.completado::before {
  filter: none;
}
</style>
</head>

<body>

<h1>AFIR</h1>

<!-- PORTADA -->

<section id="portada">

  <h2 id="nombreRifa">Cargando rifas...</h2>

  <select id="selectorRifa" disabled>
    <option value="">Cargando rifas...</option>
  </select>

  <img
    id="imagenPremio"
    alt="Premio de la rifa"
    hidden
  >

  <div id="datosRifa"></div>

  <p id="estadoPortada" class="estado">
    Conectando con AFIR...
  </p>

  <button id="participar" disabled>
    PARTICIPAR
  </button>

</section>

<!-- TABLERO -->

<section id="tablero" class="oculto">

  <button id="volver">
    ← Volver a la portada
  </button>

  <h2>Descubre el premio</h2>

  <div class="estado" id="estado">
    Actualizando tablero...
  </div>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <h2>Selecciona tus números</h2>

  <p>Azul: disponible | Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">
    Confirmar reserva
  </button>

  <p id="mensaje"></p>

</section>

<script>

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

/* IDENTIFICADOR PARA EVITAR CARGAS ANTIGUAS */

let cargaNumerosId = 0;
let enlaceNotificacion = null;

const grid = document.getElementById("grid");
const estado = document.getElementById("estado");
const mensaje = document.getElementById("mensaje");
const reservar = document.getElementById("reservar");

const portada = document.getElementById("portada");
const tablero = document.getElementById("tablero");
const selectorRifa = document.getElementById("selectorRifa");

// NORMALIZAR IMÁGENES

function normalizarImagen(valor) {
  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}

// CARGAR TODAS LAS RIFAS ACTIVAS

async function cargarRifas() {
  try {
    const respuesta = await fetch(API + "/api/raffles", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las rifas.");
    }

    const rifas = await respuesta.json();

    selectorRifa.replaceChildren();

    if (!rifas.length) {
      throw new Error("No hay rifas activas.");
    }

    rifas.forEach(rifa => {
      const option = document.createElement("option");

      option.value = rifa.id;
      option.textContent = rifa.name;

      selectorRifa.appendChild(option);
    });

    selectorRifa.disabled = false;
    document.getElementById("participar").disabled = false;

    raffleId = Number(rifas[0].id);

    selectorRifa.value = String(raffleId);

    await cargarRifa();

    document.getElementById("estadoPortada").textContent =
      "¡Participa y descubre el premio!";

  } catch(error) {

    console.error(error);

    document.getElementById("nombreRifa").textContent =
      "AFIR";

    document.getElementById("estadoPortada").textContent =
      error.message;

    selectorRifa.disabled = true;
    document.getElementById("participar").disabled = true;
  }
}

// CARGAR UNA RIFA ESPECÍFICA

async function cargarRifa() {

  if (!raffleId) return;

  const respuesta = await fetch(
    API + "/api/raffle?raffle_id=" + raffleId,
    { cache: "no-store" }
  );

  if (!respuesta.ok) {
    throw new Error("No se pudo cargar la rifa.");
  }

  const rifa = await respuesta.json();

  document.getElementById("nombreRifa").textContent =
    rifa.name;

  const imagenPremio = normalizarImagen(rifa.prize_image);

  imagenPuzzle = normalizarImagen(rifa.puzzle_image);

  const img = document.getElementById("imagenPremio");

  if (imagenPremio) {
    img.src = imagenPremio;
    img.hidden = false;
  } else {
    img.removeAttribute("src");
    img.hidden = true;
  }

  let datos = [];

  if (rifa.draw_date) {
    datos.push("Sorteo: " + rifa.draw_date);
  }

  if (rifa.ticket_price != null) {
    datos.push("Precio por número: " + rifa.ticket_price);
  }

  document.getElementById("datosRifa").textContent =
    datos.join(" | ");
}

// CAMBIAR RIFA

selectorRifa.onchange = async () => {

  const nuevoId = Number(selectorRifa.value);

  if (!Number.isSafeInteger(nuevoId) || nuevoId < 1) return;

  raffleId = nuevoId;

  cargaNumerosId++;

  seleccionados = [];
  numeros = [];

  mensaje.textContent = "";

  /* OCULTAR IMAGEN INMEDIATAMENTE */

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  document.getElementById("progreso").textContent =
    "0 de 100 números vendidos";

  try {

    await cargarRifa();

    if (!tablero.classList.contains("oculto")) {
      await cargarNumeros();
    }

  } catch(error) {

    console.error(error);

    document.getElementById("estadoPortada").textContent =
      error.message;
  }
};

// CAMBIO DE PANTALLA

document.getElementById("participar").onclick = async () => {

  if (!raffleId) return;

  portada.classList.add("oculto");
  tablero.classList.remove("oculto");

  /* MANTENER OCULTO HASTA RECIBIR LOS NÚMEROS */

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";

  window.scrollTo(0, 0);

  await cargarNumeros();
};

document.getElementById("volver").onclick = () => {

  tablero.classList.add("oculto");
  portada.classList.remove("oculto");

  window.scrollTo(0, 0);
};

// CARGAR NÚMEROS DE LA RIFA SELECCIONADA

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    /* OCULTAR EL TABLERO ANTES DE CARGAR */

    grid.classList.add("cargando");
    grid.style.backgroundImage = "none";

    estado.textContent = "Actualizando tablero...";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    /* IGNORAR RESPUESTAS DE OTRAS CARGAS O RIFAS */

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    estado.textContent =
      "Tablero conectado correctamente";

    /* MOSTRAR SOLO DESPUÉS DE DIBUJAR LOS 100 NÚMEROS */

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    estado.textContent =
      "Error al actualizar el tablero.";

    grid.style.backgroundImage = "none";

    console.error(error);
  }
}

// DIBUJAR TABLERO

function dibujarTablero() {

  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      dibujarTablero();
    };

    grid.appendChild(b);
  }

  /* APLICAR EL PUZZLE SOLO DESPUÉS DE CREAR LOS 100 BOTONES */

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle ? 'url("' + imagenPuzzle + '")' : "none"
  );
  
  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;
  
  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}

// RESERVAR NÚMEROS

reservar.onclick = async () => {

  // SEGUNDO PASO: ABRIR WHATSAPP

  if (enlaceNotificacion) {
    window.open(enlaceNotificacion, "_blank");
    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const contactType = /[a-zA-Z@_]/.test(telefono)
    ? "username"
    : "phone";

  mensaje.textContent = "";

  if (!raffleId) {
    mensaje.textContent = "Selecciona una rifa.";
    return;
  }

  if (!seleccionados.length) {
    mensaje.textContent =
      "Selecciona al menos un número.";
    return;
  }

  if (!nombre || !telefono) {
    mensaje.textContent =
      "Completa tu nombre y WhatsApp.";
    return;
  }

  reservar.disabled = true;
  reservar.textContent = "Procesando reserva...";

  try {

    const respuesta = await fetch(
      API + "/api/reservations",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          raffle_id: raffleId,
          name: nombre,
          phone: telefono,
          contactType: contactType,
          numbers: seleccionados
        })
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.error || "No se pudo completar la reserva"
      );
    }

    mensaje.replaceChildren();

    const confirmacion = document.createElement("p");

    confirmacion.textContent =
      "¡Reserva creada! Código: " +
      resultado.reservation.reservation_code +
      ". Tienes 72 horas para realizar el pago.";

    mensaje.appendChild(confirmacion);

    seleccionados = [];

    if (resultado.admin_whatsapp_url) {

      enlaceNotificacion = resultado.admin_whatsapp_url;

      reservar.textContent = "📲 Notificar al administrador";

    } else {

      reservar.textContent = "Reserva confirmada";
      reservar.disabled = true;

    }

    await cargarNumeros();

  } catch(error) {

    mensaje.textContent = error.message;

    await cargarNumeros();

    reservar.textContent = "Confirmar reserva";

  } finally {

    if (enlaceNotificacion) {
      reservar.disabled = false;
    } else if (reservar.textContent !== "Reserva confirmada") {
      reservar.disabled = false;
      reservar.textContent = "Confirmar reserva";
    }

  }
};

// INICIO

cargarRifas();

setInterval(() => {

  if (!tablero.classList.contains("oculto") && raffleId) {
    cargarNumeros();
  }

}, 20000);

</script>

</body>
</html>
