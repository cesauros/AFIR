<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1 { color: #38d9a9; }

.estado {
  margin: 15px;
  color: #b8c5d6;
  font-size: 14px;
}

#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

#portada, #tablero {
  max-width: 600px;
  margin: auto;
}

#imagenPremio {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  margin: 20px auto;
  border-radius: 12px;
}

#selectorRifa {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 20px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
  background: #263449;
  color: white;
}

#participar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 17px 35px;
  border-radius: 9px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  margin: 20px;
}

#volver {
  background: #263449;
  color: white;
  border: 1px solid #526078;
  padding: 12px 22px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  margin: 12px;
}

.oculto { display: none !important; }

/* OCULTAR EL TABLERO DURANTE LA CARGA */

.grid.cargando {
  visibility: hidden;
}

input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
}

#reservar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #38d9a9;
  font-size: 15px;
  margin: 12px;
}

@media(max-width:450px) {
  body { padding: 12px; }
}

.galeria-rifas {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 5px 25px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.tarjeta-rifa {
  flex: 0 0 82%;
  max-width: 340px;
  background: #192638;
  border: 1px solid #39485b;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  scroll-snap-align: center;
}

.tarjeta-rifa img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #263449;
}

.tarjeta-rifa .info-rifa {
  padding: 14px;
}

.tarjeta-rifa h3 {
  color: #38d9a9;
  margin: 5px 0 10px;
}

.tarjeta-rifa p {
  color: #b8c5d6;
  margin: 6px 0;
}

.tarjeta-rifa button {
  background: #25d366;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 7px;
  font-weight: bold;
  width: 100%;
}

.tarjeta-rifa .abrir-rifa {
  display: block;
  background: #25d366;
  color: white;
  text-align: center;
  padding: 12px;
  border-radius: 7px;
  font-weight: bold;
}

.tarjeta-rifa:hover {
  border-color: #38d9a9;
}

button.numero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: auto%;
  min-width: 0;
  aspect-ratio: 1;
  padding: 0;
  border: 2px solid #b9f5ff;
  border-radius: 11px;

  background:
    linear-gradient(145deg,
      #b8f5ff 0%,
      #48b9ed 18%,
      #12618f 48%,
      #031b38 100%);

  color: white;
  font-size: clamp(10px,3.2vw,17px);
  font-weight: 900;

  text-shadow: 0 1px 3px #001827;

  box-shadow:
    inset 2px 3px 5px rgba(255,255,255,.95),
    inset -3px -5px 8px rgba(0,0,0,.65),
    0 3px 0 #021020,
    0 5px 8px rgba(0,0,0,.7);
}

/* LENTE CIRCULAR DE CRISTAL */

button.numero::before {
  content: "";
  position: absolute;
  width: 80%;
  height: 80%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 2px solid rgba(235,255,255,.95);

  background:
    radial-gradient(ellipse at 30% 18%,
      rgba(255,255,255,.98) 0%,
      rgba(195,245,255,.8) 12%,
      rgba(65,175,225,.55) 35%,
      rgba(5,55,100,.9) 78%,
      #03172e 100%);

  box-shadow:
    inset 0 3px 5px rgba(255,255,255,.9),
    inset 0 -5px 8px rgba(0,0,0,.75),
    0 0 5px rgba(180,245,255,.9);
  pointer-events: none;
  z-index: -1;
}

/* REFLEJO SUPERIOR DEL CRISTAL */

button.numero:not(.vendido)::after {
  content: "";
  position: absolute;
  width: 38%;
  height: 13%;
  top: 12%;
  left: 19%;
  border-radius: 50%;
  background: rgba(255,255,255,.65);
  filter: blur(3px);
  transform: rotate(-35deg);
  pointer-events: none;
}

/* SELECCIONADO */

button.numero.seleccionado {
  background: linear-gradient(145deg,#c5fff8,#00d9bd 50%,#006b75);
  color: #003b3b;
  border-color: white;
  box-shadow:
    inset 0 3px 5px white,
    0 3px 0 #00645f,
    0 0 16px #00ffe0;
}

/* RESERVADO */

button.numero.reservado {
  background: linear-gradient(145deg,#ffd0d0,#ed526b 50%,#751329);
  border-color: #ffe0e0;
  color: white;
}

button.numero.reservado::before {
  background: radial-gradient(circle at 30% 18%,
    white,#ff9ca8 40%,#8c142e 100%);
}

/* VENDIDO: INVISIBLE */

button.numero.vendido {
  visibility: hidden !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}

button.numero.vendido::before,
button.numero.vendido::after {
  display: none !important;
  content: none !important;
}

/* INTERACCIÓN */

@media (hover:hover) {
  button.numero:not(:disabled):not(.vendido):hover {
    transform: translateY(-2px) scale(1.04);
  }
}

button.numero:active:not(:disabled) {
  transform: scale(.95);
}

@media (prefers-reduced-motion: reduce) {
  button.numero {
    transition: none;
  }
}
  
</style>
</head>

<body>

<!-- PORTADA -->

<section id="portada">

  <div id="galeriaRifas" class="galeria-rifas">
    <p>Cargando rifas...</p>
  </div>

</section>

<!-- TABLERO -->

<section id="tablero" class="oculto">

  <button id="volver">
    ← Volver a la portada
  </button>

  <h2>adivina la imagen</h2>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <p>Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">
    confirmar reserva
  </button>

  <p id="mensaje"></p>

</section>

<script>

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

/* IDENTIFICADOR PARA EVITAR CARGAS ANTIGUAS */

let cargaNumerosId = 0;
let enlaceNotificacion = null;
let reservaCreada = false;
let telefonoPendiente = "";
let comprobandoReserva = false;

async function comprobarReservaPendiente() {
  const telefono = document.getElementById("telefono").value.trim();

  if (!telefono || !raffleId || comprobandoReserva) return;

  comprobandoReserva = true;

  try {
    const respuesta = await fetch(
      API + "/api/reservations/status?raffle_id=" +
      raffleId + "&phone=" + encodeURIComponent(telefono)
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) return;

    reservar.hidden = resultado.pending;
    mensaje.textContent = resultado.pending
      ? "Ya tienes una reserva pendiente de pago. Completa el pago para poder reservar nuevamente."
      : "";

  } catch(error) {
    console.error(error);
  } finally {
    comprobandoReserva = false;
  }
}

const grid = document.getElementById("grid");
const mensaje = document.getElementById("mensaje");
const reservar = document.getElementById("reservar");

const portada = document.getElementById("portada");
const tablero = document.getElementById("tablero");

// NORMALIZAR IMÁGENES

function normalizarImagen(valor) {
  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}

// CARGAR TODAS LAS RIFAS ACTIVAS

async function cargarRifas() {
  try {
    const respuesta = await fetch(API + "/api/raffles", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las rifas.");
    }

    const rifas = await respuesta.json();
    const galeria = document.getElementById("galeriaRifas");

    galeria.replaceChildren();

    if (!rifas.length) {
      galeria.textContent = "No hay rifas activas.";
      return;
    }

    rifas.forEach(rifa => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta-rifa";

      const img = document.createElement("img");
      img.src = normalizarImagen(rifa.prize_image);
      img.alt = "Premio de " + rifa.name;

      const info = document.createElement("div");
      info.className = "info-rifa";

      const nombre = document.createElement("h3");
      nombre.textContent = rifa.name;

      info.appendChild(nombre);

      if (rifa.ticket_price != null) {
        const precio = document.createElement("p");
        precio.textContent =
          "Precio por número: " + rifa.ticket_price;
        info.appendChild(precio);
      }

      if (rifa.draw_date) {
        const fecha = document.createElement("p");
        fecha.textContent = "Sorteo: " + rifa.draw_date;
        info.appendChild(fecha);
      }

      tarjeta.appendChild(img);
      tarjeta.appendChild(info);
      tarjeta.onclick = () => abrirRifa(rifa.id);
      galeria.appendChild(tarjeta);
    });

  } catch(error) {
    console.error(error);
    document.getElementById("galeriaRifas").textContent =
      error.message;
  }
}

async function abrirRifa(id) {
  const nuevoId = Number(id);

  if (!Number.isSafeInteger(nuevoId) || nuevoId < 1) return;

  raffleId = nuevoId;

  cargaNumerosId++;
  seleccionados = [];
  numeros = [];

  mensaje.textContent = "";

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  portada.classList.add("oculto");
  tablero.classList.remove("oculto");

  window.scrollTo(0, 0);

  try {
    await cargarRifa();
    await cargarNumeros();

  } catch(error) {
    console.error(error);

    tablero.classList.add("oculto");
    portada.classList.remove("oculto");
  }
}
  
// CARGAR UNA RIFA ESPECÍFICA

async function cargarRifa() {

  if (!raffleId) return;

  const respuesta = await fetch(
    API + "/api/raffle?raffle_id=" + raffleId,
    { cache: "no-store" }
  );

  if (!respuesta.ok) {
    throw new Error("No se pudo cargar la rifa.");
  }

  const rifa = await respuesta.json();

  imagenPuzzle = normalizarImagen(rifa.puzzle_image);
}

document.getElementById("volver").onclick = () => {

  tablero.classList.add("oculto");
  portada.classList.remove("oculto");

  window.scrollTo(0, 0);
};

// CARGAR NÚMEROS DE LA RIFA SELECCIONADA

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    /* OCULTAR EL TABLERO ANTES DE CARGAR */

    grid.classList.add("cargando");
    grid.style.backgroundImage = "none";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    /* IGNORAR RESPUESTAS DE OTRAS CARGAS O RIFAS */

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    /* MOSTRAR SOLO DESPUÉS DE DIBUJAR LOS 100 NÚMEROS */

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    grid.style.backgroundImage = "none";
    
    grid.classList.add("cargando");
    
    mensaje.textContent = "No se pudo cargar el tablero. Intenta nuevamente.";
    
    console.error(error);
  }
}

// DIBUJAR TABLERO

function dibujarTablero() {

  grid.style.backgroundImage = "none";
  grid.replaceChildren();

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";
    b.style.setProperty(
      "--retardo",
      (Math.random() * 5).toFixed(2) + "s"
    );

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      dibujarTablero();
    };

    grid.appendChild(b);
  }

  /* APLICAR EL PUZZLE SOLO DESPUÉS DE CREAR LOS 100 BOTONES */

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle ? 'url("' + imagenPuzzle + '")' : "none"
  );
  
  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;
  
  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}

// RESERVAR NÚMEROS

reservar.onclick = async () => {

  // SEGUNDO CLIC: ABRIR WHATSAPP
  if (enlaceNotificacion) {
    window.open(enlaceNotificacion, "_blank");
    enlaceNotificacion = null;
    reservar.textContent = "Confirmar reserva";
    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const contactType = /[a-zA-Z@_]/.test(telefono)
    ? "username"
    : "phone";

  mensaje.textContent = "";

  if (!raffleId) {
    mensaje.textContent = "Selecciona una rifa.";
    return;
  }

  if (!seleccionados.length) {
    mensaje.textContent = "Selecciona al menos un número.";
    return;
  }

  if (!nombre || !telefono) {
    mensaje.textContent = "Completa tu nombre y WhatsApp.";
    return;
  }

  reservar.disabled = true;
  reservar.textContent = "Procesando reserva...";

  try {

    const respuesta = await fetch(
      API + "/api/reservations",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          raffle_id: raffleId,
          name: nombre,
          phone: telefono,
          contactType: contactType,
          numbers: seleccionados
        })
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.error || "No se pudo completar la reserva"
      );
    }

    mensaje.replaceChildren();

    const confirmacion = document.createElement("p");

    confirmacion.textContent =
      "¡Reserva creada! Código: " +
      resultado.reservation.reservation_code +
      ". Tienes 72 horas para realizar el pago.";

    mensaje.appendChild(confirmacion);

    enlaceNotificacion = resultado.admin_whatsapp_url;

    seleccionados = [];

    await cargarNumeros();

    if (enlaceNotificacion) {
      reservar.textContent = "Notificar por WhatsApp";
      reservar.disabled = false;
    } else {
      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;
      mensaje.appendChild(
        document.createTextNode(
          " No se pudo generar el enlace de WhatsApp."
        )
      );
    }

  } catch(error) {

    mensaje.textContent = error.message;
    reservar.textContent = "Confirmar reserva";
    reservar.disabled = false;

    await cargarNumeros();
  }
};

document.getElementById("telefono").addEventListener(
  "change",
  comprobarReservaPendiente
);

setInterval(comprobarReservaPendiente, 10000);

// INICIO

cargarRifas();

setInterval(() => {

  if (!tablero.classList.contains("oculto") && raffleId) {
    cargarNumeros();
  }

}, 20000);

</script>

</body>
</html>
