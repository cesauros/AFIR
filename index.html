<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>

/* =========================================
   AFIR - INTERFAZ HOLOGRAFICA FUTURISTA
   TABLERO 10 X 10
========================================= */

* {
  box-sizing: border-box;
}

:root {
  --holo-cyan: #48f5ff;
  --holo-blue: #247bff;
  --holo-purple: #a76aff;
  --holo-gold: #ffe09a;
  --holo-red: #ff365f;
  --holo-bg: #050a18;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 35%, #14294a 0%, #080f20 48%, #030711 100%);
  color: #e8faff;
  text-align: center;
  padding: 20px;
  margin: 0;
  min-height: 100vh;
}

h1, h2 {
  color: #a8faff;
  text-transform: uppercase;
  letter-spacing: 3px;
  text-shadow:
    0 0 8px rgba(72,245,255,.8),
    0 0 25px rgba(36,123,255,.5);
}

.estado,
#datosRifa {
  color: #a6c8e8;
  margin: 15px;
  line-height: 1.7;
}

#portada,
#tablero {
  max-width: 600px;
  margin: auto;
}

.oculto {
  display: none !important;
}

/* =========================================
   PANEL HOLOGRAFICO PRINCIPAL
========================================= */

.grid {
  position: relative;
  isolation: isolate;
  overflow: hidden;

  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));

  gap: 5px;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1;

  margin: 30px auto;
  padding: 10px;

  border: 1px solid rgba(72,245,255,.65);
  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(18,44,75,.88),
      rgba(5,12,29,.94)
    );

  box-shadow:
    0 0 12px rgba(72,245,255,.35),
    0 0 35px rgba(36,123,255,.25),
    0 0 80px rgba(36,123,255,.12),
    inset 0 0 25px rgba(72,245,255,.08);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

.grid.cargando {
  visibility: hidden;
}

/* =========================================
   HOLOGRAMA DEL PREMIO
========================================= */

.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;

  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  opacity: .75;
  filter: brightness(.75) saturate(1.2);

  transform: scale(1.035);

  pointer-events: none;
}

.grid.completado::before {
  filter: none;
  opacity: 1;
}

/* =========================================
   NUMEROS FLOTANTES DE CRISTAL
========================================= */

button.numero {
  position: relative;
  z-index: 2;

  min-width: 0;
  aspect-ratio: 1;
  padding: 0;

  overflow: hidden;

  border: 1px solid rgba(105,239,255,.55);
  border-radius: 9px;

  background:
    linear-gradient(
      145deg,
      rgba(140,240,255,.22),
      rgba(35,105,165,.20) 35%,
      rgba(8,22,48,.78) 75%,
      rgba(3,10,25,.92)
    );

  color: #d9faff;
  font-size: clamp(10px, 3.2vw, 17px);
  font-weight: bold;

  cursor: pointer;

  text-shadow:
    0 0 6px rgba(72,245,255,.8);

  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,.35),
    inset -2px -2px 5px rgba(0,0,0,.45),
    0 0 7px rgba(72,245,255,.16),
    0 5px 12px rgba(0,0,0,.45);

  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease,
    background .25s ease;
}

/* LUZ EN LOS BORDES */

button.numero::after {
  content: "";
  position: absolute;
  inset: 0;

  border-radius: inherit;

  border: 1px solid rgba(255,255,255,.10);

  background: linear-gradient(
    135deg,
    rgba(255,255,255,.10),
    transparent 40%,
    rgba(72,245,255,.08)
  );

  pointer-events: none;
}

/* MOVIMIENTO AL PASAR EL CURSOR */

button.numero:hover:not(:disabled) {
  transform: translateY(-5px) scale(1.04);

  border-color: #b7ffff;

  box-shadow:
    0 0 12px rgba(72,245,255,.8),
    0 0 28px rgba(36,123,255,.55),
    0 8px 18px rgba(0,0,0,.5),
    inset 0 0 12px rgba(72,245,255,.25);
}

/* =========================================
   NUMEROS SELECCIONADOS
========================================= */

button.numero.seleccionado {
  background:
    linear-gradient(
      145deg,
      rgba(255,239,170,.95),
      rgba(255,183,64,.85),
      rgba(150,85,15,.95)
    );

  color: #251500;

  border-color: #fff0ad;

  text-shadow: 0 0 5px white;

  box-shadow:
    0 0 10px #ffe09a,
    0 0 25px rgba(255,190,70,.8),
    0 0 45px rgba(255,160,40,.3),
    inset 0 0 12px rgba(255,255,255,.65);
}

/* =========================================
   NUMEROS RESERVADOS - ROJO RUBI
========================================= */

button.numero.reservado {
  background:
    linear-gradient(
      145deg,
      rgba(255,110,140,.95),
      rgba(190,15,65,.9) 50%,
      rgba(75,5,30,.98)
    );

  color: white;

  border-color: #ff789b;

  text-shadow:
    0 0 6px white,
    0 0 12px #ff365f;

  box-shadow:
    0 0 10px rgba(255,54,95,.7),
    0 0 22px rgba(255,20,75,.35),
    inset 0 0 12px rgba(255,255,255,.25);

  cursor: default;
}

/* =========================================
   NUMEROS VENDIDOS
========================================= */

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  box-shadow: none;
  cursor: default;
}

button.numero:disabled {
  opacity: 1;
}

/* =========================================
   ESCANER HOLOGRAFICO
========================================= */

.grid::after {
  content: "";
  position: absolute;

  left: 0;
  top: -20%;

  width: 100%;
  height: 55px;

  z-index: 1;
  pointer-events: none;

  background: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(72,245,255,.04) 15%,
    rgba(72,245,255,.28) 35%,
    rgba(255,255,255,.85) 48%,
    rgba(72,245,255,.55) 55%,
    rgba(36,123,255,.2) 75%,
    transparent 100%
  );

  box-shadow:
    0 0 15px rgba(72,245,255,.5),
    0 0 30px rgba(36,123,255,.25);

  animation: escanerHolografico 5s linear infinite;
}

@keyframes escanerHolografico {
  from {
    top: -20%;
  }

  to {
    top: 120%;
  }
}

/* =========================================
   ONDAS HOLOGRAFICAS
========================================= */

.ripple-wave {
  position: absolute;
  z-index: 1;

  pointer-events: none;
  border-radius: 50%;

  background: radial-gradient(
    circle,
    transparent 42%,
    rgba(72,245,255,.45) 47%,
    white 50%,
    rgba(72,245,255,.75) 53%,
    rgba(36,123,255,.25) 57%,
    transparent 62%
  );

  transform: translate(-50%,-50%) scale(0);

  animation: rippleExpand 1.35s ease-out forwards;
}

@keyframes rippleExpand {
  to {
    transform: translate(-50%,-50%) scale(1);
    opacity: 0;
  }
}

/* =========================================
   PARTICULAS HOLOGRAFICAS
========================================= */

.particula {
  position: absolute;
  z-index: 1;

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #8ffaff;

  box-shadow:
    0 0 6px #48f5ff,
    0 0 14px #247bff,
    0 0 24px #a76aff;

  pointer-events: none;

  will-change: transform, opacity;

  animation: flotar var(--duracion) linear forwards;
}

@keyframes flotar {
  0% {
    transform: translate3d(0,0,0) scale(.3);
    opacity: 0;
  }

  12% {
    opacity: 1;
  }

  85% {
    opacity: .85;
  }

  100% {
    transform:
      translate3d(var(--movimiento),var(--altura),0)
      scale(1.5);

    opacity: 0;
  }
}

/* =========================================
   DESTELLO 1 - RUBI HOLOGRAFICO
========================================= */

.grid .destello-escaner {
  position: absolute;
  z-index: 3;

  left: 50%;
  top: 0;

  width: 65px;
  height: 50px;

  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.9) 5%,
    rgba(255,80,100,.9) 15%,
    rgba(255,0,70,.7) 38%,
    transparent 70%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #ff174f);

  transform: translate(-50%,-50%);

  animation: nadoPez 8s ease-in-out infinite;
}

/* =========================================
   DESTELLO 3 - TURQUESA
========================================= */

.destello-tercero {
  position: absolute;
  z-index: 4;

  width: 55px;
  height: 42px;

  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.95) 8%,
    rgba(56,217,169,.9) 25%,
    rgba(56,217,169,.4) 48%,
    transparent 72%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #38d9a9);

  transform: translate(-50%,-50%);
  will-change: left, top;
}

/* =========================================
   DESTELLO 2 - PARPADEO
========================================= */

.grid .destello-rapido {
  animation: parpadeoRapido .10s steps(2,end) infinite;
}

@keyframes parpadeoRapido {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .12;
  }
}

/* =========================================
   BOTONES Y FORMULARIOS
========================================= */

#volver {
  background: rgba(15,35,65,.8);
  color: #a8faff;
  border: 1px solid #48f5ff;
  padding: 12px 22px;
  border-radius: 9px;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(72,245,255,.2);
}

#reservar,
#participar {
  background: linear-gradient(
    135deg,
    #48f5ff,
    #247bff
  );

  color: #03101f;

  border: 1px solid #b7ffff;

  padding: 15px 25px;
  border-radius: 9px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 12px rgba(72,245,255,.45),
    0 0 25px rgba(36,123,255,.2);
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

input,
#selectorRifa {
  display: block;
  width: 90%;
  max-width: 350px;

  margin: 12px auto;
  padding: 13px;

  border-radius: 8px;
  border: 1px solid rgba(72,245,255,.55);

  background: rgba(9,23,45,.9);
  color: white;

  font-size: 16px;

  box-shadow: inset 0 0 12px rgba(72,245,255,.08);
}

input::placeholder {
  color: #8eafc8;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #72faff;
  font-size: 15px;
  margin: 12px;
  text-shadow: 0 0 10px rgba(72,245,255,.5);
}

/* =========================================
   GALERIA DE RIFAS
========================================= */

.galeria-rifas {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 5px 25px;

  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.tarjeta-rifa {
  flex: 0 0 82%;
  max-width: 340px;

  background: rgba(12,28,53,.85);

  border: 1px solid rgba(72,245,255,.5);
  border-radius: 14px;

  overflow: hidden;
  cursor: pointer;

  scroll-snap-align: center;

  box-shadow: 0 0 20px rgba(36,123,255,.15);
}

.tarjeta-rifa img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #0b172c;
}

.tarjeta-rifa .info-rifa {
  padding: 14px;
}

.tarjeta-rifa h3 {
  color: #72faff;
}

.tarjeta-rifa p {
  color: #a6c8e8;
}

.tarjeta-rifa:hover {
  border-color: #a8faff;
  box-shadow: 0 0 20px rgba(72,245,255,.35);
}

/* =========================================
   MOVIL
========================================= */

@media(max-width:450px) {
  body {
    padding: 12px;
  }

  .grid {
    gap: 3px;
    padding: 6px;
  }
}
  
</style>
  
</head>

<body>

<!-- PORTADA -->

<section id="portada">

  <div id="galeriaRifas" class="galeria-rifas">
    <p>Cargando rifas...</p>
  </div>

</section>

<!-- TABLERO -->

<section id="tablero" class="oculto">

  <button id="volver">
    ← Volver a la portada
  </button>

  <h2>adivina la imagen</h2>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <p>Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">
    confirmar reserva
  </button>

  <p id="mensaje"></p>

</section>

<script>

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

/* IDENTIFICADOR PARA EVITAR CARGAS ANTIGUAS */

let cargaNumerosId = 0;
let enlaceNotificacion = null;
let reservaCreada = false;
let telefonoPendiente = "";
let comprobandoReserva = false;

async function comprobarReservaPendiente() {
  const telefono = document.getElementById("telefono").value.trim();

  if (!telefono || !raffleId || comprobandoReserva) return;

  comprobandoReserva = true;

  try {
    const respuesta = await fetch(
      API + "/api/reservations/status?raffle_id=" +
      raffleId + "&phone=" + encodeURIComponent(telefono)
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) return;

    if (!enlaceNotificacion) {
      reservar.hidden = resultado.pending;
    }
    if (!resultado.pending && enlaceNotificacion) {
      enlaceNotificacion = null;
      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;
    }

    mensaje.textContent = resultado.pending
      ? resultado.message
      : "";

  } catch(error) {
    console.error(error);
  } finally {
    comprobandoReserva = false;
  }
}

const grid = document.getElementById("grid");
  
const destello = document.createElement("div");
destello.className = "destello-escaner";
grid.appendChild(destello);

// SEGUNDO DESTELLO

const destelloRapido = document.createElement("div");
destelloRapido.className = "destello-escaner destello-rapido";
destelloRapido.style.display = "none";
destelloRapido.style.width = "100px";
destelloRapido.style.height = "100px";

grid.appendChild(destelloRapido);
  
const tablero = document.getElementById("tablero");
  
// MOVIMIENTO ALEATORIO DEL DESTELLO

let pezX = 10;
let pezY = 20;

let destinoX = 80;
let destinoY = 70;

let velocidadPez = 0.012;

let ultimoMovimiento = 0;
let pausaPez = false;

let faseOndulacion = 0;
let intensidadLuz = 1;
let direccionLuz = 1;

function nuevoDestino() {

  destinoX = -10 + Math.random() * 110;
  destinoY = -10 + Math.random() * 110;

  velocidadPez = 0.006 + Math.random() * 0.036;

  pausaPez = Math.random() < 0.15;

  ultimoMovimiento =
    performance.now() + 1500 + Math.random() * 3000;
}

function moverPez() {

  if (!tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")) {

    if (performance.now() > ultimoMovimiento) {
      nuevoDestino();
    }

    if (!pausaPez) {

      faseOndulacion += 0.055;

      const distanciaX = destinoX - pezX;
      const distanciaY = destinoY - pezY;

      pezX += distanciaX * velocidadPez;
      pezY += distanciaY * velocidadPez;

      const ondulacionX =
        Math.sin(faseOndulacion) * 2.5 +
        Math.sin(faseOndulacion * 0.45) * 1.5;
      
      const ondulacionY =
        Math.cos(faseOndulacion * 0.7) * 2.5 +
        Math.sin(faseOndulacion * 0.35) * 1.5;

      destello.style.left = (pezX + ondulacionX) + "%";
      destello.style.top = (pezY + ondulacionY) + "%";
    }

    // LUMINOSIDAD CONSTANTE
    
    destello.style.opacity = 1;
    
    destello.style.filter =
      "brightness(1.2) drop-shadow(0 0 7px white) drop-shadow(0 0 16px #38d9a9)";
  }

  requestAnimationFrame(moverPez);
}

// SEGUNDO DESTELLO: MOVIMIENTO RAPIDO E INDEPENDIENTE

let rapidoX = 0;
let rapidoY = 0;
let rapidoDestinoX = 0;
let rapidoDestinoY = 0;

let velocidadRapida = 0.04;
let proximaAparicion = performance.now() + 2000;
let destelloVisible = false;

function iniciarRecorridoRapido() {

  const lado = Math.floor(Math.random() * 4);

  if (lado === 0) {
    rapidoX = -15;
    rapidoY = Math.random() * 100;
    rapidoDestinoX = 115;
    rapidoDestinoY = Math.random() * 100;
  }

  if (lado === 1) {
    rapidoX = 115;
    rapidoY = Math.random() * 100;
    rapidoDestinoX = -15;
    rapidoDestinoY = Math.random() * 100;
  }

  if (lado === 2) {
    rapidoX = Math.random() * 100;
    rapidoY = -15;
    rapidoDestinoX = Math.random() * 100;
    rapidoDestinoY = 115;
  }

  if (lado === 3) {
    rapidoX = Math.random() * 100;
    rapidoY = 115;
    rapidoDestinoX = Math.random() * 100;
    rapidoDestinoY = -15;
  }

  velocidadRapida = 0.015 + Math.random() * 0.015;

  destelloRapido.style.left = rapidoX + "%";
  destelloRapido.style.top = rapidoY + "%";

  destelloRapido.style.display = "block";

  destelloVisible = true;
}

function moverDestelloRapido() {

  const ahora = performance.now();

  if (!tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")) {

    if (!destelloVisible && ahora >= proximaAparicion) {
      iniciarRecorridoRapido();
    }

    if (destelloVisible) {

      rapidoX += (rapidoDestinoX - rapidoX) * velocidadRapida;
      rapidoY += (rapidoDestinoY - rapidoY) * velocidadRapida;

      destelloRapido.style.left = rapidoX + "%";
      destelloRapido.style.top = rapidoY + "%";

      const distancia = Math.hypot(
        rapidoDestinoX - rapidoX,
        rapidoDestinoY - rapidoY
      );

      if (distancia < 1) {

        destelloRapido.style.display = "none";

        destelloVisible = false;

        proximaAparicion =
          ahora + 5000 + Math.random() * 7000;
      }
    }
  }

  requestAnimationFrame(moverDestelloRapido);
}

moverDestelloRapido();


// =================================
// TERCER DESTELLO
// =================================

const destelloTercero = document.createElement("div");
destelloTercero.className = "destello-tercero";
grid.appendChild(destelloTercero);

let terceroX = -15;
let terceroY = 50;

let terceroDestinoX = 50;
let terceroDestinoY = 50;

let terceroVelocidad = 30;
let terceroModo = "entrando";
let terceroPausaHasta = 0;
let terceroProximoCambio = 0;
let terceroUltimoTiempo = performance.now();

function destinoAleatorioTercero() {
  terceroDestinoX = 8 + Math.random() * 84;
  terceroDestinoY = 8 + Math.random() * 84;

  terceroVelocidad = 18 + Math.random() * 22;
  terceroModo = "moviendo";

  terceroProximoCambio =
    performance.now() + 2500 + Math.random() * 3500;
}

function entrarTercero() {
  const lado = Math.floor(Math.random() * 4);

  if (lado === 0) {
    terceroX = -15;
    terceroY = Math.random() * 100;
  } else if (lado === 1) {
    terceroX = 115;
    terceroY = Math.random() * 100;
  } else if (lado === 2) {
    terceroX = Math.random() * 100;
    terceroY = -15;
  } else {
    terceroX = Math.random() * 100;
    terceroY = 115;
  }

  terceroDestinoX = 8 + Math.random() * 84;
  terceroDestinoY = 8 + Math.random() * 84;

  terceroVelocidad = 30;
  terceroModo = "entrando";
}

function salirTercero() {
  const lado = Math.floor(Math.random() * 4);

  if (lado === 0) {
    terceroDestinoX = -15;
    terceroDestinoY = Math.random() * 100;
  } else if (lado === 1) {
    terceroDestinoX = 115;
    terceroDestinoY = Math.random() * 100;
  } else if (lado === 2) {
    terceroDestinoX = Math.random() * 100;
    terceroDestinoY = -15;
  } else {
    terceroDestinoX = Math.random() * 100;
    terceroDestinoY = 115;
  }

  terceroVelocidad = 35;
  terceroModo = "saliendo";
}

function dirigirTerceroA(boton) {
  if (!boton || !boton.isConnected) return;

  const rect = boton.getBoundingClientRect();
  const tableroRect = grid.getBoundingClientRect();

  if (!tableroRect.width || !tableroRect.height) return;

  terceroDestinoX =
    ((rect.left + rect.width / 2 - tableroRect.left) /
    tableroRect.width) * 100;

  terceroDestinoY =
    ((rect.top + rect.height / 2 - tableroRect.top) /
    tableroRect.height) * 100;

  terceroVelocidad = 200;
  terceroModo = "persiguiendo";
}

function moverTercero() {
  const ahora = performance.now();

  const delta = Math.min(
    (ahora - terceroUltimoTiempo) / 1000,
    0.05
  );

  terceroUltimoTiempo = ahora;

  if (
    !tablero.classList.contains("oculto") &&
    !grid.classList.contains("cargando")
  ) {

    if (terceroModo === "esperando") {

      if (ahora >= terceroPausaHasta) {
        destinoAleatorioTercero();
      }

    } else {

      if (
        terceroModo === "moviendo" &&
        ahora >= terceroProximoCambio
      ) {
        if (Math.random() < 0.25) {
          salirTercero();
        } else {
          destinoAleatorioTercero();
        }
      }

      const dx = terceroDestinoX - terceroX;
      const dy = terceroDestinoY - terceroY;
      const distancia = Math.hypot(dx, dy);
      const paso = terceroVelocidad * delta;

      if (distancia <= paso || distancia < 0.01) {

        terceroX = terceroDestinoX;
        terceroY = terceroDestinoY;

        if (terceroModo === "saliendo") {
          entrarTercero();

        } else if (terceroModo === "persiguiendo") {
          terceroModo = "esperando";
          terceroPausaHasta = ahora + 500;

        } else {
          destinoAleatorioTercero();
        }

      } else {
        terceroX += (dx / distancia) * paso;
        terceroY += (dy / distancia) * paso;
      }
    }

    destelloTercero.style.left = terceroX + "%";
    destelloTercero.style.top = terceroY + "%";
  }

  requestAnimationFrame(moverTercero);
}

// SISTEMA DE COLISIONES ENTRE DESTELLOS

const distanciaColision = 0.3;
const colisionesActivas = new Set();

function cambiarDireccionPorColision(destello, x, y) {

  const dx = destello.x - x;
  const dy = destello.y - y;
  const distancia = Math.hypot(dx, dy) || 1;

  const vx = dx / distancia;
  const vy = dy / distancia;

  if (destello.id === 0) {

    destinoX = Math.max(-10, Math.min(110, pezX + vx * 65));
    destinoY = Math.max(-10, Math.min(110, pezY + vy * 65));

    pausaPez = false;
    ultimoMovimiento = performance.now() + 3000;

  } else if (destello.id === 1) {

    rapidoDestinoX = Math.max(-15, Math.min(115, rapidoX + vx * 100));
    rapidoDestinoY = Math.max(-15, Math.min(115, rapidoY + vy * 100));

    velocidadRapida = 0.025 + Math.random() * 0.015;

  } else if (destello.id === 2) {

    terceroDestinoX = Math.max(8, Math.min(84, terceroX + vx * 65));
    terceroDestinoY = Math.max(8, Math.min(84, terceroY + vy * 65));

    terceroVelocidad = 35 + Math.random() * 20;
    terceroModo = "moviendo";
    terceroProximoCambio = performance.now() + 3000;
  }
}

function detectarColisiones() {

  if (
    !tablero.classList.contains("oculto") &&
    !grid.classList.contains("cargando")
  ) {

    const elementos = [
      destello,
      destelloRapido,
      destelloTercero
    ];

    const posiciones = elementos.map((elemento, id) => {

      const visible =
        id !== 1 || destelloVisible;

      if (!visible) return null;

      const rect = elemento.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();

      return {
        id,
        elemento,
        x: rect.left + rect.width / 2 - gridRect.left,
        y: rect.top + rect.height / 2 - gridRect.top,
        radio: Math.max(rect.width, rect.height) / 2
      };
    });

    const colisionados = new Set();

    const paresDetectados = new Set();

    for (let i = 0; i < posiciones.length; i++) {

      for (let j = i + 1; j < posiciones.length; j++) {

        const a = posiciones[i];
        const b = posiciones[j];

        if (!a || !b) continue;

        const dx = a.x - b.x;
        const dy = a.y - b.y;

        const distancia = Math.hypot(dx, dy);

        const limite = a.radio + b.radio;

        const par = i + "-" + j;

        if (distancia < limite * distanciaColision) {

          paresDetectados.add(par);

          if (!colisionesActivas.has(par)) {

            colisionados.add(i);
            colisionados.add(j);
          }
        }
      }
    }

    // LIBERAR COLISIONES CUANDO SE SEPARAN

    for (const par of colisionesActivas) {

      if (!paresDetectados.has(par)) {
        colisionesActivas.delete(par);
      }
    }

    // REGISTRAR NUEVAS COLISIONES

    for (const par of paresDetectados) {
      colisionesActivas.add(par);
    }

    // CAMBIAR DIRECCIÓN DE TODOS LOS IMPLICADOS

    if (colisionados.size > 0) {

      let centroX = 0;
      let centroY = 0;

      colisionados.forEach(id => {
        centroX += posiciones[id].x;
        centroY += posiciones[id].y;
      });

      centroX /= colisionados.size;
      centroY /= colisionados.size;

      colisionados.forEach(id => {

        const p = posiciones[id];

        const x = centroX;
        const y = centroY;

        cambiarDireccionPorColision(
          {
            id,
            x: p.x,
            y: p.y
          },
          x,
          y
        );
      });
    }
  }

  requestAnimationFrame(detectarColisiones);
}

// NORMALIZAR IMÁGENES

function normalizarImagen(valor) {
  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}

function crearHalftone(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const maxSize = 600;
      const scale = Math.min(1, maxSize / img.width);

      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const original = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const output = ctx.createImageData(
        canvas.width, canvas.height
      );

      const cell = 8;
      const maxRadius = cell * 0.48;

      for (let y = 0; y < canvas.height; y += cell) {
        for (let x = 0; x < canvas.width; x += cell) {

          let total = 0;
          let count = 0;

          for (let dy = 0; dy < cell; dy++) {
            for (let dx = 0; dx < cell; dx++) {
              const px = x + dx;
              const py = y + dy;

              if (px >= canvas.width || py >= canvas.height) continue;

              const i = (py * canvas.width + px) * 4;

              const brightness =
                0.299 * original.data[i] +
                0.587 * original.data[i + 1] +
                0.114 * original.data[i + 2];

              total += brightness;
              count++;
            }
          }

          const brightness = total / count;
          const radius = (1 - brightness / 255) * maxRadius;

          const cx = x + cell / 2;
          const cy = y + cell / 2;

          for (let dy = 0; dy < cell; dy++) {
            for (let dx = 0; dx < cell; dx++) {
              const px = x + dx;
              const py = y + dy;

              if (px >= canvas.width || py >= canvas.height) continue;

              const i = (py * canvas.width + px) * 4;

              const distance = Math.hypot(
                px + 0.5 - cx,
                py + 0.5 - cy
              );

              const inside = distance <= radius;

              const color = inside ? 255 : 25;

              output.data[i] = color;
              output.data[i + 1] = color;
              output.data[i + 2] = color;
              output.data[i + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(output, 0, 0);
      resolve(canvas.toDataURL("image/png"));
    };

    img.onerror = reject;
    img.src = src;
  });
}

// CARGAR TODAS LAS RIFAS ACTIVAS

async function cargarRifas() {
  try {
    const respuesta = await fetch(API + "/api/raffles", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No se pudieron cargar las rifas.");
    }

    const rifas = await respuesta.json();
    const galeria = document.getElementById("galeriaRifas");

    galeria.replaceChildren();

    if (!rifas.length) {
      galeria.textContent = "No hay rifas activas.";
      return;
    }

    rifas.forEach(rifa => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta-rifa";

      const img = document.createElement("img");
      img.src = normalizarImagen(rifa.prize_image);
      img.alt = "Premio de " + rifa.name;

      const info = document.createElement("div");
      info.className = "info-rifa";

      const nombre = document.createElement("h3");
      nombre.textContent = rifa.name;

      info.appendChild(nombre);

      if (rifa.ticket_price != null) {
        const precio = document.createElement("p");
        precio.textContent =
          "Precio por número: " + rifa.ticket_price;
        info.appendChild(precio);
      }

      if (rifa.draw_date) {
        const fecha = document.createElement("p");
        fecha.textContent = "Sorteo: " + rifa.draw_date;
        info.appendChild(fecha);
      }

      tarjeta.appendChild(img);
      tarjeta.appendChild(info);
      tarjeta.onclick = () => abrirRifa(rifa.id);
      galeria.appendChild(tarjeta);
    });

  } catch(error) {
    console.error(error);
    document.getElementById("galeriaRifas").textContent =
      error.message;
  }
}

async function abrirRifa(id) {
  const nuevoId = Number(id);

  if (!Number.isSafeInteger(nuevoId) || nuevoId < 1) return;

  raffleId = nuevoId;

  cargaNumerosId++;
  seleccionados = [];
  numeros = [];

  mensaje.textContent = "";

  grid.classList.add("cargando");
  grid.style.backgroundImage = "none";
  grid.querySelectorAll("*").forEach(elemento => {
    if (
      !elemento.classList.contains("destello-escaner") &&
      !elemento.classList.contains("destello-tercero")
    ) {
      elemento.remove();
    }
  });

  portada.classList.add("oculto");
  tablero.classList.remove("oculto");

  window.scrollTo(0, 0);

  try {
    await cargarRifa();
    await cargarNumeros();

  } catch(error) {
    console.error(error);

    tablero.classList.add("oculto");
    portada.classList.remove("oculto");
  }
}
  
// CARGAR UNA RIFA ESPECÍFICA

async function cargarRifa() {

  if (!raffleId) return;

  const respuesta = await fetch(
    API + "/api/raffle?raffle_id=" + raffleId,
    { cache: "no-store" }
  );

  if (!respuesta.ok) {
    throw new Error("No se pudo cargar la rifa.");
  }

  const rifa = await respuesta.json();

  const imagenOriginal = normalizarImagen(rifa.puzzle_image);
  imagenPuzzle = await crearHalftone(imagenOriginal);
}

// CARGAR NÚMEROS DE LA RIFA SELECCIONADA

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    /* OCULTAR EL TABLERO ANTES DE CARGAR */

    if (grid.children.length <= 3) {
      grid.classList.add("cargando");
    }
    grid.style.backgroundImage = "none";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    /* IGNORAR RESPUESTAS DE OTRAS CARGAS O RIFAS */

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    /* MOSTRAR SOLO DESPUÉS DE DIBUJAR LOS 100 NÚMEROS */

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    grid.style.backgroundImage = "none";
    
    grid.classList.add("cargando");
    
    mensaje.textContent = "No se pudo cargar el tablero. Intenta nuevamente.";
    
    console.error(error);
  }
}

// DIBUJAR TABLERO

function dibujarTablero() {

  grid.style.backgroundImage = "none";
  grid.querySelectorAll(
    "button.numero"
  ).forEach(elemento => elemento.remove());

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
      b.style.visibility = "hidden";
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      dibujarTablero();
      const botonRipple = [...grid.querySelectorAll("button.numero")]
      .find(b => b.textContent === n);
      
      crearRipple(botonRipple);
      dirigirTerceroA(botonRipple);
    };

    grid.appendChild(b);
  }

  /* APLICAR EL PUZZLE SOLO DESPUÉS DE CREAR LOS 100 BOTONES */

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle ? 'url("' + imagenPuzzle + '")' : "none"
  );
  
  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;
  
  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}

function crearRipple(boton) {
  const rect = boton.getBoundingClientRect();
  const tableroRect = grid.getBoundingClientRect();

  const x = rect.left + rect.width / 2 - tableroRect.left;
  const y = rect.top + rect.height / 2 - tableroRect.top;

  const diametro = Math.hypot(
    tableroRect.width,
    tableroRect.height
  ) * 2.2;

  const onda = document.createElement("div");

  onda.className = "ripple-wave";
  onda.style.width = diametro + "px";
  onda.style.height = diametro + "px";
  onda.style.left = x + "px";
  onda.style.top = y + "px";

  grid.appendChild(onda);

  onda.addEventListener("animationend", () => {
    onda.remove();
  }, { once: true });
}

        },

          raffle_id: raffleId,
          name: nombre,

        })

      reservar.disabled = false;
      mensaje.appendChild(
        document.createTextNode(

        )
      );
    }

  } catch(error) {

    mensaje.textContent = error.message;
    reservar.textContent = "Confirmar reserva";
    reservar.disabled = false;

    await cargarNumeros();
  }
};
