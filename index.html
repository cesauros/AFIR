<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
}

h1 { color: #38d9a9; }

.estado {
  margin: 15px;
  color: #b8c5d6;
  font-size: 14px;
}

#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

.grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 0;
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  margin: 25px auto;
  background-color: #263449;
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  border: 1px solid #526078;
}

button.numero {
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 0;
  background: #263449;
  color: white;
  font-size: clamp(10px, 3.2vw, 17px);
  cursor: pointer;
}

button.numero.seleccionado {
  background: #38d9a9;
  color: #101827;
}

button.numero.reservado {
  background: #e05252;
  color: white;
  cursor: not-allowed;
}

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  cursor: default;
}

button.numero:disabled {
  opacity: 1;
}

input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 0;
  font-size: 16px;
}

#reservar {
  background: #25d366;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #38d9a9;
  font-size: 15px;
  margin: 12px;
}

@media(max-width:450px) {
  body { padding: 12px; }
}
</style>
</head>

<body>

<h1>AFIR</h1>

<h2 id="nombreRifa">Cargando rifa...</h2>

<div id="datosRifa"></div>

<div class="estado" id="estado">
  Conectando con AFIR...
</div>

<h2>Descubre el premio</h2>

<div class="grid" id="grid"></div>

<div id="progreso">0 de 100 números vendidos</div>

<h2>Selecciona tus números</h2>

<p>Los números rojos están reservados.</p>

<input id="nombre"
  type="text"
  placeholder="Nombre y apellido"
  autocomplete="name">

<input id="telefono"
  type="text"
  placeholder="Teléfono o usuario de WhatsApp"
  autocomplete="off">

<button id="reservar">
  Confirmar reserva
</button>

<p id="mensaje"></p>

<script>
const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];

const grid = document.getElementById("grid");
const estado = document.getElementById("estado");
const mensaje = document.getElementById("mensaje");
const reservar = document.getElementById("reservar");

async function cargarRifa() {
  try {
    const respuesta = await fetch(API + "/api/raffle", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("No hay una rifa disponible.");
    }

    const rifa = await respuesta.json();

    document.getElementById("nombreRifa").textContent =
      rifa.name;

    let datos = [];

    if (rifa.draw_date) {
      datos.push("Sorteo: " + rifa.draw_date);
    }

    if (rifa.ticket_price != null) {
      datos.push("Precio: " + rifa.ticket_price);
    }

    document.getElementById("datosRifa").textContent =
      datos.join(" | ");

    const imagen = rifa.puzzle_image || rifa.prize_image;

    if (imagen) {
      grid.style.backgroundImage =
        'url("' + imagen + '")';
    } else {
      grid.style.backgroundImage = "none";
      estado.textContent = "La rifa todavía no tiene imagen.";
    }

  } catch(error) {
    console.error(error);
    estado.textContent = error.message;
  }
}

async function cargarNumeros() {
  try {
    const respuesta = await fetch(API + "/api/numbers", {
      cache: "no-store"
    });

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    numeros = await respuesta.json();

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);
      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    estado.textContent = "Tablero conectado correctamente";

  } catch(error) {
    estado.textContent = "Error al actualizar el tablero.";
    console.error(error);
  }
}

function dibujarTablero() {
  grid.innerHTML = "";

  for (let i = 0; i < 100; i++) {
    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);
    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {
      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      dibujarTablero();
    };

    grid.appendChild(b);
  }
}

reservar.onclick = async () => {
  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const contactType = /[a-zA-Z@_]/.test(telefono)
    ? "username"
    : "phone";

  mensaje.textContent = "";

  if (!seleccionados.length) {
    mensaje.textContent = "Selecciona al menos un número.";
    return;
  }

  if (!nombre || !telefono) {
    mensaje.textContent = "Completa tu nombre y WhatsApp.";
    return;
  }

  reservar.disabled = true;
  reservar.textContent = "Procesando reserva...";

  try {
    const respuesta = await fetch(
      API + "/api/reservations",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: nombre,
          phone: telefono,
          contactType: contactType,
          numbers: seleccionados
        })
      }
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.error || "No se pudo completar la reserva"
      );
    }

    mensaje.textContent =
      "¡Reserva creada! Código: " +
      resultado.reservation.reservation_code +
      ". Tienes 72 horas para realizar el pago.";

    seleccionados = [];

    await cargarNumeros();

  } catch(error) {
    mensaje.textContent = error.message;
    await cargarNumeros();

  } finally {
    reservar.disabled = false;
    reservar.textContent = "Confirmar reserva";
  }
};

cargarRifa();
cargarNumeros();

setInterval(() => {
  cargarNumeros();
}, 20000);

</script>
</body>
</html>
