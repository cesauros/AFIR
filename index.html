<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFIR - Rifa Online</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #080c14;
  color: #f5ead0;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1, h2 {
  color: #e8c778;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.estado,
#datosRifa {
  color: #b8c5d6;
  margin: 15px;
  line-height: 1.7;
}

#portada,
#tablero {
  max-width: 600px;
  margin: auto;
}

.oculto {
  display: none !important;
}

/* TABLERO */

.grid {
  position: relative;
  isolation: isolate;
  overflow: hidden;

  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 5px;

  width: 100%;
  max-width: 500px;
  aspect-ratio: 1;

  margin: 25px auto;
  padding: 8px;

  background: #101722;
  border: 1px solid #b9974b;
  border-radius: 15px;

  box-shadow:
    0 0 12px rgba(218,174,78,.25),
    0 0 35px rgba(218,174,78,.12),
    inset 0 0 25px rgba(0,0,0,.9);
}

.grid.cargando {
  visibility: hidden;
}

/* IMAGEN HOLOGRÁFICA */

.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;

  background-image: var(--puzzle);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  filter: blur(2px) brightness(.65);
  transform: scale(1.04);
  pointer-events: none;
}

.grid.completado::before {
  filter: none;
}

.grid.celebracion {
  animation: iluminarTablero 1.2s ease-in-out infinite alternate;
}

@keyframes iluminarTablero {
  from {
    box-shadow:
      0 0 15px rgba(255,215,100,.5),
      0 0 35px rgba(255,190,50,.3),
      inset 0 0 25px rgba(255,210,100,.15);
  }

  to {
    box-shadow:
      0 0 30px rgba(255,230,140,1),
      0 0 75px rgba(255,190,50,.85),
      inset 0 0 45px rgba(255,220,120,.4);
  }
}

/* NÚMEROS */

button.numero {
  position: relative;
  z-index: 2;

  min-width: 0;
  aspect-ratio: 1;
  padding: 0;

  border: 1px solid rgba(224,190,112,.65);
  border-radius: 7px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.17),
    rgba(34,42,53,.82) 45%,
    rgba(7,12,20,.96)
  );

  color: #f5e5bc;
  font-size: clamp(10px, 3.2vw, 17px);
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    inset 1px 1px 3px rgba(255,255,255,.2),
    inset -2px -2px 5px rgba(0,0,0,.8),
    0 2px 5px rgba(0,0,0,.7);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

/* HOVER */

button.numero:hover:not(:disabled) {
  transform: translateY(-3px);

  border-color: #ffe5a0;

  box-shadow:
    0 0 8px rgba(255,211,119,.7),
    0 0 18px rgba(255,190,70,.35),
    inset 0 0 8px rgba(255,255,255,.25);
}

/* SELECCIONADOS */

button.numero.seleccionado {
  background: linear-gradient(
    145deg,
    #fff0b3,
    #d8a83e 45%,
    #805515
  );

  color: #211707;
  border-color: #fff0b3;

  box-shadow:
    0 0 8px #e8bd58,
    0 0 20px rgba(255,193,65,.65),
    inset 0 0 8px rgba(255,255,255,.6);
}

/* RESERVADOS */

button.numero.reservado {
  background: linear-gradient(
    145deg,
    #ff7777,
    #a81425 50%,
    #4c0712
  );

  color: white;
  border-color: #ff7777;

  box-shadow:
    0 0 8px rgba(255,40,55,.65),
    inset 0 0 7px rgba(255,255,255,.2);

  cursor: default;
}

/* VENDIDOS */

button.numero.vendido {
  background: transparent;
  color: transparent;
  border-color: transparent;
  box-shadow: none;
  cursor: default;
}

button.numero:disabled {
  opacity: 1;
}

/* ESCÁNER DORADO */

.grid::after {
  content: "";
  position: absolute;
  z-index: 1;
  pointer-events: none;

  left: 0;
  top: -20%;

  width: 100%;
  height: 45px;

  background: linear-gradient(
    to bottom,
    transparent,
    rgba(255,195,75,.12),
    rgba(255,215,125,.7),
    white,
    rgba(255,195,75,.5),
    transparent
  );

  box-shadow: 0 0 18px rgba(255,190,70,.6);

  animation: escaner 6s linear infinite;
}

@keyframes escaner {
  from { top: -20%; }
  to { top: 120%; }
}

/* RIPPLE */

.ripple-wave {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  border-radius: 50%;

  background: radial-gradient(
    circle,
    transparent 42%,
    rgba(255,210,115,.5) 47%,
    white 50%,
    rgba(255,190,70,.7) 53%,
    transparent 62%
  );

  transform: translate(-50%, -50%) scale(0);
  animation: rippleExpand 1.35s ease-out forwards;
}

@keyframes rippleExpand {
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
  }
}

/* PARTÍCULAS */

.particula {
  position: absolute;
  z-index: 1;

  width: 8px;
  height: 8px;
  border-radius: 50%;

  background: #ffd783;

  box-shadow:
    0 0 7px #ffd700,
    0 0 15px #ffbf00,
    0 0 25px #fff2a0;

  pointer-events: none;
  animation: flotar var(--duracion) linear forwards;
}

@keyframes flotar {
  0% {
    transform: translate3d(0,0,0) scale(.3);
    opacity: 0;
  }

  12% { opacity: 1; }

  85% { opacity: .85; }

  100% {
    transform:
      translate3d(var(--movimiento),var(--altura),0)
      scale(1.5);
    opacity: 0;
  }
}

/* DESTELLO 1: AZUL ZAFIRO */

.grid .destello-escaner {
  position: absolute;
  z-index: 3;

  left: 50%;
  top: 0;

  width: 45px;
  height: 45px;
  border-radius: 50%;

  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.9) 5%,
    rgba(80,170,255,.9) 15%,
    rgba(15,75,190,.7) 38%,
    transparent 70%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #1769ff);

  transform: translate(-50%, -50%);
  animation: nadoPez 8s ease-in-out infinite;
  border: 1px solid rgba(100, 170, 255, .75);
  border-radius: 50%;
  box-shadow:
    0 0 5px rgba(70, 145, 255, .8),
    inset 0 0 4px rgba(255, 255, 255, .5);
  outline: 1px solid rgba(100, 170, 255, .5);
  outline-offset: 30px;
}

/* DESTELLO 3: DORADO CHAMPÁN */

.destello-tercero {
  position: absolute;
  z-index: 4;

  width: 60px;
  height: 60px;
  border-radius: 50%;

  pointer-events: none;

  background: radial-gradient(
  ellipse at center,
  white 0%,
  rgba(255,255,255,.95) 8%,
  rgba(232,199,120,.95) 25%,
  rgba(232,199,120,.7) 48%,
  transparent 72%
);

filter:
  drop-shadow(0 0 6px white)
  drop-shadow(0 0 15px #e8c778);

  transform: translate(-50%, -50%);
}

/* DESTELLO 2: DORADO Y PARPADEO */

.grid .destello-rapido {
  background: radial-gradient(
    ellipse at center,
    white 0%,
    rgba(255,255,255,.95) 8%,
    rgba(255,215,80,.95) 20%,
    rgba(255,180,30,.8) 40%,
    rgba(218,145,0,.4) 60%,
    transparent 75%
  );

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 15px #ffd700)
    drop-shadow(0 0 25px #ffae00);

  animation: parpadeoRapido .10s steps(2,end) infinite;
}

@keyframes parpadeoRapido {
  0%, 100% { opacity: 1; }
  50% { opacity: .12; }
}

/* BOTONES Y FORMULARIOS */

#volver {
  background: #172233;
  color: #e8c778;
  border: 1px solid #a88745;
  padding: 12px 22px;
  border-radius: 8px;
  cursor: pointer;
}

#reservar,
#participar {
  background: linear-gradient(145deg,#e8c778,#a87926);
  color: #17110a;
  border: 1px solid #ffe6a0;
  padding: 15px 25px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

#reservar:disabled {
  opacity: .5;
  cursor: wait;
}

input,
#selectorRifa {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 12px auto;
  padding: 13px;
  border-radius: 7px;
  border: 1px solid #8e7444;
  background: #172233;
  color: white;
  font-size: 16px;
}

#mensaje {
  margin: 18px auto;
  max-width: 450px;
  line-height: 1.5;
}

#progreso {
  color: #e8c778;
  font-size: 15px;
  margin: 12px;
}

/* GALERÍA */

.galeria-rifas {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 5px 25px;
  scroll-snap-type: x mandatory;
}

.tarjeta-rifa {
  flex: 0 0 82%;
  max-width: 340px;
  background: #111c2b;
  border: 1px solid #a88745;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  scroll-snap-align: center;
}

.tarjeta-rifa img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  background: #172233;
}

.tarjeta-rifa .info-rifa {
  padding: 14px;
}

.tarjeta-rifa h3 {
  color: #e8c778;
}

.tarjeta-rifa p {
  color: #b8c5d6;
}

@media(max-width:450px) {
  body { padding: 12px; }
  .grid { gap: 3px; padding: 5px; }
}
  
</style>
  
</head>

<body>

<!-- PORTADA -->

<section id="portada">

  <div id="galeriaRifas" class="galeria-rifas">
    <p>Cargando rifas...</p>
  </div>

</section>

<!-- TABLERO -->

<section id="tablero" class="oculto">

  <button id="volver">
    ← Volver a la portada
  </button>

  <h2>adivina la imagen</h2>

  <div class="grid cargando" id="grid"></div>

  <div id="progreso">0 de 100 números vendidos</div>

  <p>Rojo: reservado</p>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre y apellido"
    autocomplete="name"
  >

  <input
    id="telefono"
    type="text"
    placeholder="Teléfono o usuario de WhatsApp"
    autocomplete="off"
  >

  <button id="reservar">
    confirmar reserva
  </button>

  <p id="mensaje"></p>

</section>

<script>

const API = "https://blue-poetry-7c73.cesauro.workers.dev";

let seleccionados = [];
let numeros = [];
let imagenPuzzle = "";
let raffleId = null;

/* IDENTIFICADOR PARA EVITAR CARGAS ANTIGUAS */

let cargaNumerosId = 0;
let enlaceNotificacion = null;
let reservaCreada = false;

// ESTADOS DE INTERACCIÓN DE LOS DESTELLOS

let danzaActiva = false;
let celebracionActiva = false;
let notificacionEnviada = false;

let anguloDanza = 0;
let ultimoFrameDanza = performance.now();
let aparicionDanza = 0;
let separacionDanza = 0;
let tiempoColision = 0;

let transicionDestellos = null;
let radioOrbitalInicial = 40;
const RADIO_ORBITAL_MINIMO = 40;
const DURACION_TRANSICION = 800;

function posicionDestello(elemento, x, y) {
  return {
    x: parseFloat(elemento.style.left) || x,
    y: parseFloat(elemento.style.top) || y
  };
}

function iniciarTransicionDanza(activar) {

  const p1 = posicionDestello(destello, pezX);
  const p2 = posicionDestello(destelloRapido, rapidoX);

  if (activar) {

    const r1 = Math.hypot(p1.x - 50, p1.y - 50);
    const r2 = Math.hypot(p2.x - 50, p2.y - 50);

    radioOrbitalInicial = (r1 + r2) / 2;

    anguloDanza = Math.atan2(
      p1.y - 50,
      p1.x - 50
    );

    destelloVisible = true;
    destelloRapido.style.display = "block";

  }

  transicionDestellos = {
    tipo: activar ? "entrada" : "salida",
    inicio: performance.now(),
    desde1: p1,
    desde2: p2,
    radio: radioOrbitalInicial
  };

  ultimoFrameDanza = performance.now();
}

function progresoTransicion() {

  if (!transicionDestellos) return 1;

  const t = Math.min(
    (performance.now() - transicionDestellos.inicio) /
    DURACION_TRANSICION,
    1
  );

  return t * t * (3 - 2 * t);
}
  
let telefonoPendiente = "";
let comprobandoReserva = false;

async function comprobarReservaPendiente() {
  const telefono = document.getElementById("telefono").value.trim();

  if (!telefono || !raffleId || comprobandoReserva) return;

  comprobandoReserva = true;

  try {
    const respuesta = await fetch(
      API + "/api/reservations/status?raffle_id=" +
      raffleId + "&phone=" + encodeURIComponent(telefono)
    );

    const resultado = await respuesta.json();

    if (!respuesta.ok) return;

    if (!enlaceNotificacion) {
      reservar.hidden = resultado.pending;
    }
    if (!resultado.pending && enlaceNotificacion) {
      enlaceNotificacion = null;
      reservar.textContent = "Confirmar reserva";
      reservar.disabled = false;
    }

    mensaje.textContent = resultado.pending
      ? resultado.message
      : "";

  } catch(error) {
    console.error(error);
  } finally {
    comprobandoReserva = false;
  }
}

const grid = document.getElementById("grid");
  
const destello = document.createElement("div");
destello.className = "destello-escaner";
grid.appendChild(destello);

// SEGUNDO DESTELLO

const destelloRapido = document.createElement("div");
destelloRapido.className = "destello-escaner destello-rapido";
destelloRapido.style.display = "none";
destelloRapido.style.width = "100px";
destelloRapido.style.height = "100px";

grid.appendChild(destelloRapido);
  
const tablero = document.getElementById("tablero");
  
// MOVIMIENTO ALEATORIO DEL DESTELLO

let pezX = 10;
let pezY = 20;

let destinoX = 80;
let destinoY = 70;

let velocidadPez = 0.012;

let ultimoMovimiento = 0;
let pausaPez = false;

let faseOndulacion = 0;
let intensidadLuz = 1;
let direccionLuz = 1;

function nuevoDestino() {

  destinoX = -30 + Math.random() * 130;
  destinoY = -30 + Math.random() * 130;

  velocidadPez = 0.006 + Math.random() * 0.036;

  pausaPez = Math.random() < 0.15;

  ultimoMovimiento =
    performance.now() + 1500 + Math.random() * 3000;
}

function moverPez() {

  if (!tablero.classList.contains("oculto") &&
      !grid.classList.contains("cargando")) {

    if (performance.now() > ultimoMovimiento) {
      nuevoDestino();
    }

    if (!pausaPez) {

      faseOndulacion += 0.055;

      const distanciaX = destinoX - pezX;
      const distanciaY = destinoY - pezY;

      pezX += distanciaX * velocidadPez;
      pezY += distanciaY * velocidadPez;

      const ondulacionX =
        Math.sin(faseOndulacion) * 2.5 +
        Math.sin(faseOndulacion * 0.45) * 1.5;
      
      const ondulacionY =
        Math.cos(faseOndulacion * 0.7) * 2.5 +
        Math.sin(faseOndulacion * 0.35) * 1.5;

      if (celebracionActiva) {

        const angulo = performance.now() * 0.0015;
      
        destello.style.left =
          (50 + Math.cos(angulo) * 25) + "%";
      
        destello.style.top =
          (50 + Math.sin(angulo) * 25) + "%";
      
            } else if (danzaActiva ||
              (transicionDestellos?.tipo === "salida" &&
               progresoTransicion() < 1)) {
      
              const t = progresoTransicion();
      
              const ahora = performance.now();
              const delta = Math.min(
                (ahora - ultimoFrameDanza) / 1000,
                0.05
              );
      
              ultimoFrameDanza = ahora;
      
              const radio = transicionDestellos.radio +
                (RADIO_ORBITAL_MINIMO - transicionDestellos.radio) * t;
      
              anguloDanza += delta * 9;
      
              const objetivoX =
                50 + Math.cos(anguloDanza) * (radio + separacionDanza);
      
              const objetivoY =
                50 + Math.sin(anguloDanza) * (radio + separacionDanza);
      
              let x, y;
      
              if (transicionDestellos.tipo === "entrada") {
      
                x = transicionDestellos.desde1.x +
                  (objetivoX - transicionDestellos.desde1.x) * t;
      
                y = transicionDestellos.desde1.y +
                  (objetivoY - transicionDestellos.desde1.y) * t;
      
              } else {
      
                const normalX = pezX + ondulacionX;
                const normalY = pezY + ondulacionY;
      
                x = transicionDestellos.desde1.x +
                  (normalX - transicionDestellos.desde1.x) * t;
      
                y = transicionDestellos.desde1.y +
                  (normalY - transicionDestellos.desde1.y) * t;
              }
      
              destello.style.left = x + "%";
              destello.style.top = y + "%";
      
            } else {
      
              destello.style.left = (pezX + ondulacionX) + "%";
              destello.style.top = (pezY + ondulacionY) + "%";
      
            }
    }

    // LUMINOSIDAD CONSTANTE
    
    destello.style.opacity = 1;
    
    destello.style.filter =
      "brightness(1.2) drop-shadow(0 0 7px white) drop-shadow(0 0 16px #38d9a9)";
  }

  requestAnimationFrame(moverPez);
}

// SEGUNDO DESTELLO: MOVIMIENTO RAPIDO E INDEPENDIENTE

let rapidoX = 0;
let rapidoY = 0;
let rapidoDestinoX = 0;
let rapidoDestinoY = 0;

let velocidadRapida = 0.04;
let proximaAparicion = performance.now() + 2000;
let destelloVisible = false;

function iniciarRecorridoRapido() {

  const lado = Math.floor(Math.random() * 4);

  if (lado === 0) {
    rapidoX = -15;
    rapidoY = Math.random() * 100;
    rapidoDestinoX = 115;
    rapidoDestinoY = Math.random() * 100;
  }

  if (lado === 1) {
    rapidoX = 115;
    rapidoY = Math.random() * 100;
    rapidoDestinoX = -15;
    rapidoDestinoY = Math.random() * 100;
  }

  if (lado === 2) {
    rapidoX = Math.random() * 100;
    rapidoY = -15;
    rapidoDestinoX = Math.random() * 100;
    rapidoDestinoY = 115;
  }

  if (lado === 3) {
    rapidoX = Math.random() * 100;
    rapidoY = 115;
    rapidoDestinoX = Math.random() * 100;
    rapidoDestinoY = -15;
  }

  velocidadRapida = 0.015 + Math.random() * 0.015;

  destelloRapido.style.left = rapidoX + "%";
  destelloRapido.style.top = rapidoY + "%";

  destelloRapido.style.display = "block";

  destelloVisible = true;
}

function moverDestelloRapido() {

  const ahora = performance.now();

  if (
    !tablero.classList.contains("oculto") &&
    !grid.classList.contains("cargando")
  ) {

    if (celebracionActiva) {

      const angulo = ahora * 0.0015 + 2.094;

      rapidoX = 50 + Math.cos(angulo) * 25;
      rapidoY = 50 + Math.sin(angulo) * 25;

      destelloRapido.style.display = "block";
      destelloRapido.style.left = rapidoX + "%";
      destelloRapido.style.top = rapidoY + "%";

      destelloVisible = true;

    } else if (danzaActiva ||
      (transicionDestellos?.tipo === "salida" &&
       progresoTransicion() < 1)) {

      const t = progresoTransicion();

      let x, y;

      if (transicionDestellos.tipo === "entrada") {

        const radio = transicionDestellos.radio +
          (RADIO_ORBITAL_MINIMO - transicionDestellos.radio) * t;

        const angulo = anguloDanza + Math.PI;

        const objetivoX =
          50 + Math.cos(angulo) * (radio + separacionDanza);

        const objetivoY =
          50 + Math.sin(angulo) * (radio + separacionDanza);

        x = transicionDestellos.desde2.x +
          (objetivoX - transicionDestellos.desde2.x) * t;

        y = transicionDestellos.desde2.y +
          (objetivoY - transicionDestellos.desde2.y) * t;

      } else {

        rapidoX +=
          (rapidoDestinoX - rapidoX) * velocidadRapida;

        rapidoY +=
          (rapidoDestinoY - rapidoY) * velocidadRapida;

        x = transicionDestellos.desde2.x +
          (rapidoX - transicionDestellos.desde2.x) * t;

        y = transicionDestellos.desde2.y +
          (rapidoY - transicionDestellos.desde2.y) * t;
      }

      destelloRapido.style.display = "block";

      destelloRapido.style.left = x + "%";
      destelloRapido.style.top = y + "%";

      rapidoX = x;
      rapidoY = y;

      destelloVisible = true;

    } else {

      if (!destelloVisible && ahora >= proximaAparicion) {
        iniciarRecorridoRapido();
      }

      if (destelloVisible) {

        rapidoX += (rapidoDestinoX - rapidoX) * velocidadRapida;
        rapidoY += (rapidoDestinoY - rapidoY) * velocidadRapida;

        destelloRapido.style.left = rapidoX + "%";
        destelloRapido.style.top = rapidoY + "%";

        const distancia = Math.hypot(
          rapidoDestinoX - rapidoX,
          rapidoDestinoY - rapidoY
        );

        if (distancia < 1) {
          destelloRapido.style.display = "none";
          destelloVisible = false;
          proximaAparicion = ahora + 5000 + Math.random() * 7000;
        }
      }
    }
  }

  requestAnimationFrame(moverDestelloRapido);

function destinoAleatorioTercero() {
  terceroDestinoX = 8 + Math.random() * 84;
  terceroDestinoY = 8 + Math.random() * 84;

  terceroVelocidad = 18 + Math.random() * 22;

function entrarTercero() {
  const lado = Math.floor(Math.random() * 4);

  if (lado === 0) {
    terceroX = -15;
    terceroY = Math.random() * 100;
  } else if (lado === 1) {
    terceroX = 115;
    terceroY = Math.random() * 100;
  } else if (lado === 2) {
    terceroX = Math.random() * 100;
    terceroY = -15;
  } else {
    terceroX = Math.random() * 100;
    terceroY = 115;
  }

  terceroDestinoX = 8 + Math.random() * 84;
  terceroDestinoY = 8 + Math.random() * 84;

  terceroVelocidad = 30;
  terceroModo = "entrando";
}

function salirTercero() {
  const lado = Math.floor(Math.random() * 4);

  if (lado === 0) {
    terceroDestinoX = -15;
    terceroDestinoY = Math.random() * 100;
  } else if (lado === 1) {
    terceroDestinoX = 115;
    terceroDestinoY = Math.random() * 100;
  } else if (lado === 2) {
    terceroDestinoX = Math.random() * 100;
    terceroDestinoY = -15;
  } else {
    terceroDestinoX = Math.random() * 100;
    terceroDestinoY = 115;
  }

  terceroVelocidad = 35;
  terceroModo = "saliendo";
}

function dirigirTerceroA(boton) {
  if (!boton || !boton.isConnected) return;

  const rect = boton.getBoundingClientRect();
  const tableroRect = grid.getBoundingClientRect();

  if (!tableroRect.width || !tableroRect.height) return;

  terceroDestinoX =
    ((rect.left + rect.width / 2 - tableroRect.left) /
    tableroRect.width) * 100;

  terceroDestinoY =
    ((rect.top + rect.height / 2 - tableroRect.top) /
    tableroRect.height) * 100;

  terceroVelocidad = 200;
  terceroModo = "persiguiendo";
}

function moverTercero() {

  const ahora = performance.now();

  const delta = Math.min(
    (ahora - terceroUltimoTiempo) / 1000,
    0.05
  );

  terceroUltimoTiempo = ahora;

  if (
    !tablero.classList.contains("oculto") &&
    !grid.classList.contains("cargando")
  ) {

    if (celebracionActiva) {

      const angulo = ahora * 0.0015 + 4.188;

      terceroX = 50 + Math.cos(angulo) * 25;
      terceroY = 50 + Math.sin(angulo) * 25;

    } else {

      if (terceroModo === "esperando") {

        if (ahora >= terceroPausaHasta) {
          destinoAleatorioTercero();
        }

      } else {

        if (
          terceroModo === "moviendo" &&
          ahora >= terceroProximoCambio
        ) {
          if (Math.random() < 0.25) {
            salirTercero();
          } else {
            destinoAleatorioTercero();
          }
        }

        const dx = terceroDestinoX - terceroX;
        const dy = terceroDestinoY - terceroY;
        const distancia = Math.hypot(dx, dy);
        const paso = terceroVelocidad * delta;

        if (distancia <= paso || distancia < 0.01) {

          terceroX = terceroDestinoX;
          terceroY = terceroDestinoY;

          if (terceroModo === "saliendo") {
            entrarTercero();

          } else if (terceroModo === "persiguiendo") {
            terceroModo = "esperando";
            terceroPausaHasta = ahora + 500;

          } else {
            destinoAleatorioTercero();
          }

        } else {

          terceroX += (dx / distancia) * paso;
          terceroY += (dy / distancia) * paso;

        }
      }
    }

    destelloTercero.style.left = terceroX + "%";
    destelloTercero.style.top = terceroY + "%";
  }

  requestAnimationFrame(moverTercero);
}

const distanciaColision = 0.65;
const colisionesActivas = new Set();

function cambiarDireccionPorColision(destello, x, y) {

  const dx = destello.x - x;
  const dy = destello.y - y;
  const distancia = Math.hypot(dx, dy) || 1;

  const vx = dx / distancia;
  const vy = dy / distancia;

  if (destello.id === 0) {

    destinoX = Math.max(-10, Math.min(110, pezX + vx * 65));
    destinoY = Math.max(-10, Math.min(110, pezY + vy * 65));

    pausaPez = false;
    ultimoMovimiento = performance.now() + 3000;

  } else if (destello.id === 1) {

    rapidoDestinoX = Math.max(-15, Math.min(115, rapidoX + vx * 100));
    rapidoDestinoY = Math.max(-15, Math.min(115, rapidoY + vy * 100));

    velocidadRapida = 0.025 + Math.random() * 0.015;

  } else if (destello.id === 2) {

    terceroDestinoX = Math.max(8, Math.min(84, terceroX + vx * 65));
    terceroDestinoY = Math.max(8, Math.min(84, terceroY + vy * 65));

    terceroVelocidad = 35 + Math.random() * 20;
    terceroModo = "moviendo";
    terceroProximoCambio = performance.now() + 3000;
  }

  // RECUPERAR LA DANZA DESPUÉS DEL IMPACTO

  if (danzaActiva && !celebracionActiva) {
    separacionDanza = 35;
    tiempoColision = performance.now();
  }
}

function detectarColisiones() {

  if (
    !tablero.classList.contains("oculto") &&
    !grid.classList.contains("cargando")
  ) {

    const elementos = [
      destello,
      destelloRapido,
      destelloTercero
    ];

    const posiciones = elementos.map((elemento, id) => {

      const visible =
        id !== 1 || destelloVisible;
    
      if (!visible) return null;
    
      const rect = elemento.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();
    
      return {
        id,
        elemento,
        x: rect.left + rect.width / 2 - gridRect.left,
        y: rect.top + rect.height / 2 - gridRect.top,
        radio: Math.max(rect.width, rect.height) / 2
      };
    });

    // DETECTAR DANZA ENTRE LOS DESTELLOS 1 Y 2

    if (danzaActiva && !celebracionActiva) {
      const a = posiciones[0];
      const b = posiciones[1];
    
      if (a && b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distancia = Math.hypot(dx, dy);
    
        if (distancia < 100) {
          separacionDanza = Math.min(35, separacionDanza + 1);
        } else {
          separacionDanza = Math.max(0, separacionDanza - 0.5);
        }
      }
    }
    
    const colisionados = new Set();

    const paresDetectados = new Set();

    for (let i = 0; i < posiciones.length; i++) {

      for (let j = i + 1; j < posiciones.length; j++) {

        const a = posiciones[i];
        const b = posiciones[j];

        if (!a || !b) continue;

        const dx = a.x - b.x;
        const dy = a.y - b.y;

        const distancia = Math.hypot(dx, dy);

        const limite = a.radio + b.radio;

        const par = i + "-" + j;

        if (distancia < limite * distanciaColision) {

          paresDetectados.add(par);

          if (!colisionesActivas.has(par)) {

            colisionados.add(i);
            colisionados.add(j);
          }
        }
      }
    }

    // LIBERAR COLISIONES CUANDO SE SEPARAN

    for (const par of colisionesActivas) {

      if (!paresDetectados.has(par)) {
        colisionesActivas.delete(par);
      }
    }

    // REGISTRAR NUEVAS COLISIONES

    for (const par of paresDetectados) {
      colisionesActivas.add(par);
    }

    // CAMBIAR DIRECCIÓN DE TODOS LOS IMPLICADOS

    if (colisionados.size > 0) {

    // SEPARACIÓN TEMPORAL DE LOS PUNTOS 1 Y 2

    if (danzaActiva && (colisionados.has(0) || colisionados.has(1))) {
    
      separacionDanza = 5;
    
      tiempoColision = performance.now();
    
    }

      let centroX = 0;
      let centroY = 0;

      colisionados.forEach(id => {
        centroX += posiciones[id].x;
        centroY += posiciones[id].y;
      });

      centroX /= colisionados.size;
      centroY /= colisionados.size;

      colisionados.forEach(id => {

        const p = posiciones[id];

        const x = centroX;
        const y = centroY;

        cambiarDireccionPorColision(
          {
            id,
            x: p.x,
            y: p.y
          },
          x,
          y
        );
      });
    }
  }

  // RECUPERAR LA DANZA DESPUÉS DEL IMPACTO

  if (
    separacionDanza > 0 &&
    performance.now() - tiempoColision > 900
  ) {
    separacionDanza = 0;
  }

  requestAnimationFrame(detectarColisiones);
}

// NORMALIZAR IMÁGENES

function normalizarImagen(valor) {
  if (!valor) return "";

  const imagen = String(valor);

  if (
    imagen.startsWith("data:image/") ||
    imagen.startsWith("https://") ||
    imagen.startsWith("http://")
  ) {
    return imagen;
  }

  return "data:image/jpeg;base64," + imagen;
}

function crearHalftone(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const maxSize = 600;
      const scale = Math.min(1, maxSize / img.width);

      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const original = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const output = ctx.createImageData(
        canvas.width, canvas.height
      );

      const cell = 8;
      const maxRadius = cell * 0.48;

      for (let y = 0; y < canvas.height; y += cell) {
        for (let x = 0; x < canvas.width; x += cell) {

          let total = 0;
          let count = 0;

          for (let dy = 0; dy < cell; dy++) {
            for (let dx = 0; dx < cell; dx++) {
              const px = x + dx;
              const py = y + dy;

              if (px >= canvas.width || py >= canvas.height) continue;

              const i = (py * canvas.width + px) * 4;

              const brightness =
                0.299 * original.data[i] +
                0.587 * original.data[i + 1] +
                0.114 * original.data[i + 2];

              total += brightness;
              count++;
            }
          }

          const brightness = total / count;
          const radius = (1 - brightness / 255) * maxRadius;

          const cx = x + cell / 2;
          const cy = y + cell / 2;

          for (let dy = 0; dy < cell; dy++) {
            for (let dx = 0; dx < cell; dx++) {
              const px = x + dx;
              const py = y + dy;

              if (px >= canvas.width || py >= canvas.height) continue;

              const i = (py * canvas.width + px) * 4;

              const distance = Math.hypot(
                px + 0.5 - cx,
                py + 0.5 - cy
              );

              const inside = distance <= radius;

              const color = inside ? 255 : 25;

              output.data[i] = color;
              output.data[i + 1] = color;
              output.data[i + 2] = color;
              output.data[i + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(output, 0, 0);
      resolve(canvas.toDataURL("image/png"));
    };

    img.onerror = reject;
    img.src = src;
  });
}

async function cargarRifas() {

async function cargarNumeros() {

  if (!raffleId) return;

  const idSolicitado = raffleId;
  const solicitud = ++cargaNumerosId;

  try {

    /* OCULTAR EL TABLERO ANTES DE CARGAR */

    if (grid.children.length <= 3) {
      grid.classList.add("cargando");
    }
    grid.style.backgroundImage = "none";

    const respuesta = await fetch(
      API + "/api/numbers?raffle_id=" + idSolicitado,
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("Error consultando los números.");
    }

    const datos = await respuesta.json();

    /* IGNORAR RESPUESTAS DE OTRAS CARGAS O RIFAS */

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    numeros = datos;

    seleccionados = seleccionados.filter(n => {
      const item = numeros.find(x => x.number === n);

      return item && item.status === "available";
    });

    dibujarTablero();

    const vendidos = numeros.filter(
      x => x.status === "sold"
    ).length;

    document.getElementById("progreso").textContent =
      vendidos + " de 100 números vendidos";

    /* MOSTRAR SOLO DESPUÉS DE DIBUJAR LOS 100 NÚMEROS */

    grid.classList.remove("cargando");

  } catch(error) {

    if (
      solicitud !== cargaNumerosId ||
      idSolicitado !== raffleId
    ) {
      return;
    }

    grid.style.backgroundImage = "none";
    
    grid.classList.add("cargando");
    
    mensaje.textContent = "No se pudo cargar el tablero. Intenta nuevamente.";
    
    console.error(error);
  }
}

// DIBUJAR TABLERO

function dibujarTablero() {

  grid.style.backgroundImage = "none";
  grid.querySelectorAll(
    "button.numero"
  ).forEach(elemento => elemento.remove());

  for (let i = 0; i < 100; i++) {

    const n = String(i).padStart(2, "0");

    const item = numeros.find(x => x.number === n);

    const status = item ? item.status : "available";

    const b = document.createElement("button");

    b.textContent = n;
    b.className = "numero";

    if (status === "reserved") {
      b.classList.add("reservado");
      b.disabled = true;
    }

    if (status === "sold") {
      b.classList.add("vendido");
      b.disabled = true;
      b.style.visibility = "hidden";
    }

    if (seleccionados.includes(n)) {
      b.classList.add("seleccionado");
    }

    b.onclick = () => {

      if (status !== "available") return;

      if (seleccionados.includes(n)) {
        seleccionados = seleccionados.filter(x => x !== n);
      } else {
        seleccionados.push(n);
      }

      // TRANSICIÓN DE LOS DESTELLOS 1 Y 2

      if (seleccionados.length > 0 && !danzaActiva) {
        iniciarTransicionDanza(true);
      }

      if (seleccionados.length === 0 && danzaActiva) {
        iniciarTransicionDanza(false);
        separacionDanza = 0;
      }

      danzaActiva = seleccionados.length > 0;

      dibujarTablero();
      const botonRipple = [...grid.querySelectorAll("button.numero")]
      .find(b => b.textContent === n);
      
      crearRipple(botonRipple);
      dirigirTerceroA(botonRipple);
    };

    grid.appendChild(b);
  }

  /* APLICAR EL PUZZLE SOLO DESPUÉS DE CREAR LOS 100 BOTONES */

  grid.style.setProperty(
    "--puzzle",
    imagenPuzzle ? 'url("' + imagenPuzzle + '")' : "none"
  );
  
  const vendidos = numeros.filter(
    x => x.status === "sold"
  ).length;
  
  grid.classList.toggle(
    "completado",
    vendidos === 100
  );
}

function crearRipple(boton) {
  const rect = boton.getBoundingClientRect();
  const tableroRect = grid.getBoundingClientRect();

  const x = rect.left + rect.width / 2 - tableroRect.left;
  const y = rect.top + rect.height / 2 - tableroRect.top;

  const diametro = Math.hypot(
    tableroRect.width,
    tableroRect.height
  ) * 2.2;

  const onda = document.createElement("div");

  onda.className = "ripple-wave";
  onda.style.width = diametro + "px";
  onda.style.height = diametro + "px";
  onda.style.left = x + "px";
  onda.style.top = y + "px";

  grid.appendChild(onda);

  onda.addEventListener("animationend", () => {
    onda.remove();
  }, { once: true });
}

};

document.getElementById("telefono").addEventListener(
  "change",
  comprobarReservaPendiente
);

setInterval(comprobarReservaPendiente, 10000);

function crearParticula() {

  if (
    grid.classList.contains("cargando") ||
    tablero.classList.contains("oculto") ||
    grid.classList.contains("completado")
  ) return;

  // Límite de seguridad para evitar sobrecargar el navegador
  if (grid.querySelectorAll(".particula").length >= 120) return;

  const particula = document.createElement("div");

  particula.className = "particula";

  particula.style.left = Math.random() * 100 + "%";
  particula.style.top = Math.random() * 100 + "%";

  particula.style.setProperty(
    "--duracion",
    (5 + Math.random() * 3) + "s"
  );

  particula.style.setProperty(
    "--movimiento",
    (Math.random() * 100 - 50) + "px"
  );

  particula.style.setProperty(
    "--altura",
    (-40 - Math.random() * 100) + "px"
  );

  grid.appendChild(particula);

  particula.addEventListener("animationend", () => {
    particula.remove();
  }, { once: true });
}

setInterval(crearParticula, 65);

// INICIO

cargarRifas();

setInterval(() => {

  if (!tablero.classList.contains("oculto") && raffleId) {
    cargarNumeros();
  }

}, 20000);

</script>
